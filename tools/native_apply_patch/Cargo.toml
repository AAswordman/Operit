[workspace]
members = [".", "vendor/absolute-path", "vendor/path-uri", "compat/fs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.dependencies]
rustix = "=1.1.4"
libc = "=0.2.186"
tokio-util = "=0.7.18"
anyhow = "=1.0.103"
similar = "=2.7.0"
thiserror = "=2.0.18"
tokio = "=1.52.3"
assert_cmd = "=2.1.2"
assert_matches = "=1.5.0"
pretty_assertions = "=1.4.1"
tempfile = "=3.27.0"
dirs = "=6.0.0"
dunce = "=1.0.5"
schemars = "=0.8.22"
serde = "=1.0.228"
serde_json = "=1.0.149"
ts-rs = "=11.1.0"
base64 = "=0.22.1"
url = "=2.5.8"
urlencoding = "=2.1.3"
codex-utils-absolute-path = { path = "vendor/absolute-path" }
codex-utils-path-uri = { path = "vendor/path-uri" }
codex-exec-server = { package = "operit-patch-fs", path = "compat/fs" }

[package]
name = "operit-native-apply-patch"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "codex_apply_patch"
doctest = false

[[bin]]
name = "apply_patch"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
anyhow.workspace = true
similar.workspace = true
thiserror.workspace = true
codex-exec-server.workspace = true
codex-utils-absolute-path.workspace = true
codex-utils-path-uri.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "fs", "io-util", "time"] }

[dev-dependencies]
assert_cmd.workspace = true
assert_matches.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true

[profile.release]
strip = true
lto = "thin"

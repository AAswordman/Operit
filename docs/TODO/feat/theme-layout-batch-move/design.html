<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f6f2" />
    <title>Operit · 主题与外观 · 布局设计稿</title>
    <style>
      /* 与模型工作区保持同一套留白、描边和自然色，页面直接铺满视口。 */
      :root {
        --bg: #f5f6f2;
        --surface: #ffffff;
        --raised: #fafbf8;
        --ink: #29332d;
        --muted: #7a837b;
        --line: #e4e9e0;
        --accent: #526e59;
        --accent-ink: #ffffff;
        --soft: #eaf0e6;
        --soft-ink: #45604a;
        --quiet: #f0f3ed;
        --track: #e1e7dd;
        --danger: #b05246;
        --user-bubble: #dce8d6;
        --user-text: #29392b;
        --ai-bubble: #ffffff;
        --ai-text: #30392f;
        --input-alpha: 0.82;
        --glass-blur: 12px;
        --glass-opacity: 0.24;
        --shadow: 0 20px 70px #1b342323;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei",
          sans-serif;
        color-scheme: light;
        -webkit-tap-highlight-color: transparent;
      }
      html[data-theme="dark"] {
        --bg: #171e1a;
        --surface: #222c25;
        --raised: #263129;
        --ink: #e4ece0;
        --muted: #9eac9b;
        --line: #354136;
        --accent: #b4cda8;
        --accent-ink: #263b26;
        --soft: #2d3e2d;
        --soft-ink: #c1d7b5;
        --quiet: #29342c;
        --track: #3c4d3e;
        --shadow: 0 20px 70px #0007;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html {
        height: 100%;
        scrollbar-gutter: stable;
      }
      body {
        margin: 0;
        min-height: 100%;
        color: var(--ink);
        background: var(--bg);
        font-size: 14px;
        line-height: 1.5;
      }
      body.modal-open {
        overflow: hidden;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
        border: 0;
        background: none;
        touch-action: manipulation;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      button,
      input,
      select {
        outline-offset: 4px;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
      }
      button,
      a,
      input {
        -webkit-tap-highlight-color: transparent;
      }
      a {
        color: var(--accent);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.5px;
      }
      h2 {
        font-size: 15px;
        font-weight: 650;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
      }
      .icon {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: middle;
      }
      .icon.small {
        width: 16px;
        height: 16px;
      }
      .icon-button {
        width: 42px;
        height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        flex: 0 0 auto;
      }
      .icon-button:hover {
        background: var(--quiet);
      }
      .app-header {
        position: relative;
        z-index: 5;
        padding: max(8px, env(safe-area-inset-top)) 18px 0;
        background: var(--bg);
      }
      .titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 56px;
      }
      .titlebar h1 {
        flex: 1;
      }
      .header-state {
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .state-dot {
        width: 5px;
        height: 5px;
        background: var(--accent);
        border-radius: 50%;
      }
      .header-state.dirty .state-dot {
        background: #c28d4e;
      }
      .scope-picker {
        margin: 6px 0 0;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 12px 14px;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: var(--surface);
      }
      .scope-picker .scope-copy {
        flex: 1;
        min-width: 0;
      }
      .scope-name {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 15px;
        font-weight: 600;
      }
      .scope-name span {
        font-size: 10px;
        font-weight: 400;
        color: var(--accent);
        background: var(--soft);
        border-radius: 5px;
        padding: 1px 5px;
      }
      .scope-sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 1px;
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #dce6d5;
        color: #4c654f;
        flex: 0 0 auto;
        overflow: hidden;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .avatar.small {
        width: 26px;
        height: 26px;
      }
      .avatar.rounded {
        border-radius: 8px;
      }
      .avatar.user {
        background: #e5dece;
        color: #776b4e;
      }
      .avatar-art {
        width: 100%;
        height: 100%;
        display: block;
      }
      .tab-shell {
        position: sticky;
        top: 0;
        z-index: 8;
        padding: 0 18px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      .tabs {
        display: flex;
        gap: 8px;
        height: 51px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tab {
        position: relative;
        padding: 0 10px;
        flex: 1;
        white-space: nowrap;
        font-size: 14px;
        color: var(--muted);
      }
      .tab[aria-selected="true"] {
        color: var(--accent);
        font-weight: 650;
      }
      .tab[aria-selected="true"]::after {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 0;
        height: 3px;
        background: var(--accent);
        border-radius: 3px 3px 0 0;
      }
      .workspace {
        padding: 16px 18px calc(100px + env(safe-area-inset-bottom));
        display: grid;
        gap: 14px;
        align-items: start;
      }
      .editor {
        min-width: 0;
      }
      .panel {
        display: grid;
        gap: 13px;
      }
      .section {
        border-radius: 17px;
        border: 1px solid var(--line);
        background: var(--surface);
        overflow: hidden;
      }
      .section-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 16px 16px 8px;
      }
      .section-head > .icon {
        width: 18px;
        height: 18px;
        color: var(--accent);
      }
      .section-head h2 {
        flex: 1;
      }
      .section-head .meta {
        margin-left: auto;
      }
      .meta {
        color: var(--muted);
        font-size: 11px;
      }
      .section-note {
        color: var(--muted);
        font-size: 12px;
        padding: 0 16px 12px;
      }
      .body-pad {
        padding: 4px 16px 15px;
      }
      .row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 59px;
        text-align: left;
        padding: 12px 16px;
      }
      .row + .row::before,
      .row-separator::before {
        content: "";
        position: absolute;
        left: 16px;
        right: 16px;
        top: 0;
        border-top: 1px solid var(--line);
        opacity: 0.7;
      }
      .row-copy {
        flex: 1;
        min-width: 0;
      }
      .row-title {
        font-size: 13px;
        font-weight: 500;
      }
      .row-sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
        line-height: 1.5;
      }
      .row-value {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      button.row:hover {
        background: var(--raised);
      }
      .chevron {
        width: 16px;
        height: 16px;
        color: var(--muted);
      }
      .switch {
        display: inline-flex;
        width: 36px;
        height: 22px;
        background: var(--track);
        border: 1px solid transparent;
        border-radius: 99px;
        padding: 2px;
        flex: 0 0 auto;
        transition: background 0.18s;
      }
      .switch::after {
        content: "";
        width: 16px;
        height: 16px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 1px 3px #0002;
        transition: transform 0.18s;
      }
      [aria-checked="true"] > .switch {
        background: var(--accent);
      }
      [aria-checked="true"] > .switch::after {
        transform: translateX(14px);
        background: var(--accent-ink);
      }
      .control {
        padding: 10px 16px 14px;
      }
      .control + .control {
        border-top: 1px solid var(--line);
      }
      .control-label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 9px;
        font-size: 12px;
      }
      .control-label output {
        margin-left: auto;
        color: var(--accent);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .segmented {
        display: flex;
        padding: 3px;
        border-radius: 10px;
        background: var(--quiet);
        gap: 3px;
        width: 100%;
      }
      .segmented button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        flex: 1;
        min-height: 35px;
        padding: 7px 9px;
        font-size: 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        white-space: nowrap;
      }
      .segmented button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--accent);
        border-color: var(--line);
        box-shadow: 0 1px 3px #152b1510;
        font-weight: 600;
      }
      .segment-block {
        padding: 8px 16px 14px;
      }
      .segment-block .control-label {
        margin-bottom: 8px;
      }
      .palette-row {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 5px;
        padding: 8px 12px 15px;
      }
      .palette {
        display: grid;
        justify-items: center;
        gap: 8px;
        padding: 6px 2px;
        min-width: 0;
        font-size: 11px;
        color: var(--muted);
        border-radius: 12px;
      }
      .palette-dot {
        width: 37px;
        height: 37px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--swatch);
        outline: 1px solid #7b877332;
        outline-offset: 3px;
        color: white;
      }
      .palette-dot .icon {
        opacity: 0;
        width: 18px;
        height: 18px;
        stroke-width: 2;
        filter: drop-shadow(0 1px 2px #0005);
      }
      .palette[aria-pressed="true"] {
        color: var(--accent);
        font-weight: 600;
      }
      .palette[aria-pressed="true"] .palette-dot {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      .palette[aria-pressed="true"] .palette-dot .icon {
        opacity: 1;
      }
      .color-dot {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--color);
        border: 1px solid #81907840;
        box-shadow: 0 0 0 3px var(--surface);
        flex: 0 0 auto;
      }
      .mini-pair {
        display: inline-flex;
        align-items: center;
        padding: 2px;
      }
      .mini-pair .color-dot + .color-dot {
        margin-left: -8px;
      }
      .badge {
        font-size: 10px;
        border-radius: 6px;
        padding: 2px 6px;
        background: var(--quiet);
        color: var(--muted);
        font-weight: 400;
        white-space: nowrap;
      }
      .range {
        width: 100%;
        height: 25px;
        margin: 2px 0;
        display: block;
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
        cursor: pointer;
      }
      .range::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 8px;
        background: linear-gradient(
          to right,
          var(--accent) 0 var(--progress, 0%),
          var(--track) var(--progress, 0%) 100%
        );
      }
      .range::-webkit-slider-thumb {
        appearance: none;
        width: 15px;
        height: 15px;
        background: var(--accent);
        border: 3px solid var(--surface);
        box-shadow: 0 0 0 1px var(--accent);
        border-radius: 50%;
        margin-top: -5.5px;
      }
      .range::-moz-range-track {
        height: 4px;
        background: var(--track);
        border-radius: 5px;
      }
      .range::-moz-range-progress {
        height: 4px;
        background: var(--accent);
      }
      .range::-moz-range-thumb {
        height: 12px;
        width: 12px;
        border: 3px solid var(--surface);
        background: var(--accent);
        border-radius: 50%;
      }
      .range-ends {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted);
        margin-top: 0;
      }
      .fold-head {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 16px;
        width: 100%;
        text-align: left;
      }
      .fold-head > .icon:first-child {
        color: var(--accent);
        width: 18px;
        height: 18px;
      }
      .fold-head strong {
        font-size: 14px;
        font-weight: 600;
        flex: 1;
      }
      .fold-head .icon:last-child {
        transition: transform 0.2s;
        width: 16px;
        height: 16px;
        color: var(--muted);
      }
      .fold-head[aria-expanded="true"] .icon:last-child {
        transform: rotate(180deg);
      }
      .fold-body {
        border-top: 1px solid var(--line);
      }
      .primary,
      .secondary,
      .text-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 40px;
        padding: 9px 16px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 500;
      }
      .primary {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .secondary {
        background: var(--quiet);
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .text-button {
        color: var(--accent);
        background: transparent;
      }
      .danger {
        color: var(--danger);
      }
      .small-button {
        padding: 6px 10px;
        min-height: 32px;
        font-size: 11px;
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.65;
      }
      .inline-note {
        margin: 0 16px 15px;
        border-radius: 9px;
        background: var(--quiet);
        padding: 9px 11px;
        display: flex;
        gap: 7px;
        align-items: flex-start;
        font-size: 11px;
        color: var(--muted);
      }
      .inline-note .icon {
        width: 14px;
        height: 14px;
        margin-top: 2px;
        color: var(--accent);
      }
      .preview {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 17px;
        background: var(--surface);
        overflow: hidden;
      }
      .preview-head {
        display: flex;
        align-items: center;
        gap: 8px;
        text-align: left;
        width: 100%;
        min-height: 48px;
        padding: 12px 15px;
      }
      .preview-head > .icon:first-child {
        width: 17px;
        height: 17px;
        color: var(--accent);
      }
      .preview-head strong {
        flex: 1;
        font-size: 12px;
        font-weight: 600;
      }
      .live-mark {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        color: var(--muted);
        margin-right: 2px;
      }
      .live-mark::before {
        content: "";
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #86a37b;
      }
      .preview-head > .icon:last-child {
        width: 14px;
        height: 14px;
        color: var(--muted);
      }
      .chat-preview {
        position: relative;
        overflow: hidden;
        isolation: isolate;
        background: var(--quiet);
        padding: 14px 14px 11px;
        border-top: 1px solid var(--line);
      }
      .wallpaper {
        position: absolute;
        z-index: -2;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .wallpaper img,
      .wallpaper video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: var(--media-x, 50%) var(--media-y, 50%);
      }
      .wallpaper .natural-scene {
        width: 100%;
        height: 100%;
        transform-origin: var(--media-x, 50%) var(--media-y, 50%);
      }
      .natural-scene {
        background:
          radial-gradient(ellipse at 17% 0%, #f6f6e4 0, transparent 43%),
          radial-gradient(ellipse at 90% 85%, #a6b79c 0, transparent 53%),
          linear-gradient(135deg, #e7e9d9, #d4dfcb 53%, #dfe2d5);
        position: relative;
        overflow: hidden;
      }
      .natural-scene::before,
      .natural-scene::after {
        content: "";
        position: absolute;
        width: 34%;
        height: 140%;
        top: -27%;
        left: 53%;
        border-radius: 100% 0 100% 0;
        background: #748c6a2e;
        transform: rotate(28deg);
        box-shadow:
          -110px 120px 0 6px #7d987627,
          95px 15px 0 -12px #54764e26;
        filter: blur(10px);
      }
      .natural-scene::after {
        left: 5%;
        top: 25%;
        height: 85%;
        background: #f9f8e66b;
        transform: rotate(-42deg);
        box-shadow: 170px -50px 0 #f4efd64d;
        filter: blur(14px);
      }
      html[data-theme="dark"] .natural-scene {
        background:
          radial-gradient(ellipse at 16% 5%, #6c7e5b 0, transparent 43%),
          radial-gradient(ellipse at 87% 95%, #263e30 0, transparent 55%),
          linear-gradient(135deg, #46513a, #253b2c 60%, #172d22);
      }
      .preview-conversation {
        display: grid;
        gap: 12px;
        min-height: 132px;
        align-content: center;
        font-size: 12px;
        position: relative;
      }
      .preview-message {
        display: flex;
        gap: 7px;
        align-items: flex-end;
        max-width: 94%;
      }
      .preview-message.user-message {
        flex-direction: row-reverse;
        margin-left: auto;
      }
      .preview-message .message-body {
        min-width: 0;
      }
      .preview-name {
        font-size: 9px;
        opacity: 0.65;
        padding: 0 3px 3px;
      }
      .preview-message.user-message .preview-name {
        text-align: right;
      }
      .bubble {
        padding: 9px 12px;
        border-radius: 12px 12px 12px 3px;
        color: var(--ai-text);
        background: var(--ai-bubble);
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      .user-message .bubble {
        border-radius: 12px 12px 3px 12px;
        background: var(--user-bubble);
        color: var(--user-text);
      }
      .bubble-command .bubble {
        border-radius: 6px !important;
        border-left: 2px solid var(--accent);
        box-shadow: none;
      }
      .bubble-square .bubble {
        border-radius: 1px !important;
      }
      .bubble-wide .preview-message {
        max-width: 100%;
        align-items: start;
      }
      .bubble-wide .preview-message .message-body {
        flex: 1;
      }
      .message-footer {
        font-size: 8px;
        opacity: 0.56;
        padding: 4px 2px 0;
      }
      .preview-input {
        margin-top: 15px;
        padding: 7px 8px 7px 11px;
        background: rgb(255 255 255 / var(--input-alpha));
        border: 1px solid #95a18e35;
        border-radius: 10px;
        display: flex;
        gap: 8px;
        align-items: center;
        min-height: 36px;
      }
      html[data-theme="dark"] .preview-input {
        background: rgb(35 47 39 / var(--input-alpha));
      }
      .preview-input.floating {
        border-radius: 25px;
        margin: 15px 10px 4px;
        box-shadow: 0 4px 13px #1c35221c;
      }
      .preview-input span {
        color: var(--muted);
        font-size: 10px;
        flex: 1;
      }
      .preview-input .icon {
        width: 14px;
        height: 14px;
        color: var(--accent);
      }
      .preview-input .send {
        display: grid;
        place-items: center;
        width: 23px;
        height: 23px;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-ink);
        margin-left: auto;
      }
      .preview-input .send .icon {
        color: inherit;
        width: 12px;
        height: 12px;
      }
      .preview-input.classic .send {
        border-radius: 50%;
      }
      .preview-foot {
        padding: 8px 13px;
        font-size: 10px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .preview-foot button {
        color: var(--accent);
        font-size: 10px;

        align-items: center;
        gap: 12px;

        font-size: 11px;
        line-height: 1.6;

        height: 40px;
        border-radius: 9px;

        place-items: center;
        background: var(--soft);

      .modal-overlay {

        inset: 0;
        background: #11221966;

        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;

      .modal {
        width: min(100%, 500px);

        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--shadow);

        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--line);
      }
      .modal-head {
        display: flex;
        align-items: center;
        padding: 12px 13px 8px 20px;
        gap: 10px;
      }
      .modal-head h2 {
        flex: 1;
        font-size: 17px;
      }
      .modal-body {
        padding: 0 4px 12px;
        overflow: auto;
        overscroll-behavior: contain;
      }
      .modal-body > .hint {
        padding: 0 16px 10px;
      }
      .modal-body .section {
        border-radius: 12px;
        margin: 5px 12px 12px;
      }
      .modal-footer {
        border-top: 1px solid var(--line);
        padding: 11px 16px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        background: var(--surface);
      }
      .modal-footer .primary {
        min-width: 85px;
      }
      .field {
        padding: 10px 16px;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        margin-bottom: 7px;
      }
      .field input[type="text"],
      .field input[type="number"],
      .field select {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--raised);
        color: var(--ink);
        padding: 8px 11px;
        font-size: 13px;
      }
      .color-input {
        position: absolute;
        inset: 0;
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }
      .color-control {
        position: relative;
        min-width: 34px;
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .color-editor {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .color-editor input[type="text"] {
        width: 93px;
        background: var(--quiet);
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--ink);
        padding: 6px 8px;
        font-size: 11px;
      }
      .avatar-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
        padding: 6px 16px 14px;
      }
      .avatar-card {
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 14px 8px 8px;
        display: grid;
        justify-items: center;
        gap: 9px;
        background: var(--raised);
        font-size: 11px;
        text-align: center;
      }
      .avatar-card .avatar {
        width: 48px;
        height: 48px;
      }
      .upload-preview {
        margin: 8px 16px;
        height: 92px;
        border: 1px dashed var(--line);
        border-radius: 11px;
        display: grid;
        place-items: center;
        text-align: center;
        gap: 4px;
        overflow: hidden;
        background: var(--raised);
      }
      .upload-preview img {
        height: 100%;
        max-width: 100%;
        object-fit: contain;
      }
      .option-mark {
        color: var(--accent);
      }
      .choice-row[aria-checked="true"] {
        background: var(--soft);
        color: var(--soft-ink);
        border-radius: 10px;
      }
      .choice-row[aria-checked="false"] .option-mark {
        opacity: 0;
      }
      .menu-action {
        min-height: 61px;
      }
      .menu-action .icon:first-child {
        color: var(--accent);
      }
      .menu-action.danger .icon:first-child {
        color: var(--danger);
      }
      .toast {
        position: fixed;
        bottom: calc(88px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%) translateY(8px);
        max-width: calc(100vw - 40px);
        background: #293b2eee;
        color: #f5f8f0;
        border-radius: 12px;
        padding: 11px 17px;
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        font-size: 12px;
        transition: 0.2s;
        box-shadow: 0 8px 25px #0002;
      }
      .toast.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .screen-cover {
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        opacity: 0.075;
        overflow: hidden;
      }
      .screen-cover > * {
        height: 100%;
        width: 100%;
      }
      .page-glass .section {
        background: color-mix(in srgb, var(--surface) 78%, transparent);
        backdrop-filter: blur(var(--glass-blur));
      }
      .page-glass .app-header,
      .page-glass .tab-shell {
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(16px);
      }
      .demo-skip {
        margin: 0 16px 12px;
        color: var(--muted);
        font-size: 10px;
      }
      .divider {
        height: 1px;
        margin: 8px 16px;
        background: var(--line);
      }
      @media (min-width: 850px) {
        .app-header {
          padding-left: 30px;
          padding-right: 30px;
        }
        .scope-picker {
          max-width: 600px;
        }
        .tab-shell {
          padding-left: 30px;
          padding-right: 30px;
        }
        .tabs {
          max-width: 600px;
          gap: 35px;
        }
        .workspace {
          padding: 22px 30px 110px;
          grid-template-columns: minmax(0, 1fr) minmax(290px, 0.7fr);
          gap: 24px;
        }
        .preview {
          grid-column: 2;
          grid-row: 1;
          position: sticky;
          top: 73px;
        }
        .editor {
          grid-column: 1;
          grid-row: 1;
        }
        .chat-preview {
          min-height: 300px;
          padding: 28px 22px 20px;
        }
        .preview-conversation {
          min-height: 180px;
          font-size: 13px;
          gap: 23px;
        }
        .preview-input {
          margin-top: 26px;
        }
        .actionbar {
          padding-left: 30px;
          padding-right: 30px;
        }
      }
      @media (max-width: 350px) {
        .app-header {
          padding-left: 12px;
          padding-right: 12px;
        }
        .workspace {
          padding-left: 12px;
          padding-right: 12px;
        }
        .tab-shell {
          padding: 0 12px;
        }
        .tabs {
          gap: 8px;
        }
        .header-state {
          display: none;
        }
        .palette-dot {
          width: 31px;
          height: 31px;
        }
        .row {
          gap: 8px;
          padding-left: 13px;
          padding-right: 13px;
        }
        .row-value {
          max-width: 100px;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .actionbar {
          gap: 8px;
          padding-left: 12px;
          padding-right: 12px;
        }
        .actionbar .primary {
          min-width: 108px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }

      body {
        position: relative;
        isolation: isolate;
      }
      .thinking-preview {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 9px;
        color: var(--muted);
        padding: 0 3px 5px;
      }
      .thinking-preview .icon {
        width: 11px;
        height: 11px;
      }
      .thought-copy {
        font-size: 10px;
        color: var(--muted);
        padding: 4px 7px 8px;
        max-width: 240px;
      }
      .message-footer {
        text-align: left;
        display: block;
      }
      .preview-metadata {
        font-size: 9px;
        color: var(--muted);
        line-height: 1.8;
        padding: 7px;
        background: var(--quiet);
        border-radius: 6px;
        margin-top: 5px;
      }
      .preview-input > .icon {
        flex: 0 0 auto;
      }
      .preview-input > span:not(.send) {
        flex: 1;
      }
      .processing-preview {
        font-size: 9px;
        color: var(--muted);
        padding: 7px 7px 0;
      }
      .particle-preview {
        position: absolute;
        right: 22px;
        bottom: 54px;
        font-size: 25px;
        text-shadow: 0 0 3px #738e69;
        animation: particles 1s ease-in-out infinite alternate;
      }
      @keyframes particles {
        to {
          opacity: 0.35;
          transform: translateY(-8px);
        }
      }
      .drawer-demo {
        position: absolute;
        z-index: 3;
        inset: 0 auto 0 0;
        width: 126px;
        border-right: 1px solid #82927c3d;
        padding: 18px 10px;
        display: flex;
        flex-direction: column;
        gap: 9px;
        box-shadow: 8px 0 20px #1d34271a;
        font-size: 10px;
        color: #344c3a;
      }
      .drawer-demo > span {
        padding: 7px;
        border-radius: 7px;
      }
      .drawer-demo strong {
        padding: 0 7px 8px;
      }
      .drawer-demo i {
        font-style: normal;
        width: 32px;
        height: 29px;
        display: grid;
        place-items: center;
        border-radius: 7px;
      }
      .drawer-demo .icon {
        width: 14px;
        height: 14px;
      }
      .full.chat-preview {
        min-height: 360px;
        border-radius: 13px;
        margin: 6px 12px 0;
        border: 1px solid var(--line);
        padding-top: 26px;
      }
      .full .preview-conversation {
        gap: 24px;
      }
      .full + .preview-foot {
        padding-left: 18px;
        padding-right: 18px;
      }
      .confirm-copy {
        font-size: 13px;
        color: var(--muted);
        padding: 8px 16px 18px;
        line-height: 1.8;
      }
      .font-specimen {
        background: var(--quiet);
        margin: 0 16px 12px;
        border-radius: 12px;
        padding: 20px 16px;
        font-size: 16px;
        line-height: 1.9;
      }
      .font-specimen span {
        color: var(--muted);
        font-size: 12px;
      }
      .advanced-native {
        margin: 8px 16px 12px;
        border-top: 1px solid var(--line);
      }
      .advanced-native summary {
        padding: 12px 0 4px;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
      }
      input[aria-invalid="true"] {
        border-color: var(--danger) !important;
      }
      .modal-body .row-copy {
        overflow-wrap: anywhere;
      }
      .scope-picker .scope-sub {
        display: block;
      }
      .scope-name strong {
        font-weight: 600;
      }
      .scope-name {
        line-height: 1.6;
      }
      .row .icon {
        flex-shrink: 0;
      }
      /* 布局页沿用主题色与卡片，数值入口保留小数精调。 */
      .layout-scope { cursor: default; }
      .layout-scope .avatar { background: var(--soft); color: var(--accent); }
      .layout-control { padding: 14px 16px 12px; }
      .layout-control + .layout-control { border-top: 1px solid var(--line); }
      .layout-control .control-label { margin-bottom: 3px; }
      .layout-control .control-label > span { flex: 1; font-size: 13px; }
      .layout-value { padding: 5px 8px; min-width: 69px; min-height: 32px; border-radius: 8px; background: var(--soft); color: var(--accent); white-space: nowrap; }
      .layout-value output { pointer-events: none; font-size: 12px; font-variant-numeric: tabular-nums; }
      .layout-control .row-sub { margin: 1px 0 8px; }
      .layout-control .range { height: 30px; }
      .layout-range-foot { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 3px; }
      .layout-range-foot > span { color: var(--muted); font-size: 10px; }
      .layout-default { padding: 5px 0 5px 8px; font-size: 10px; color: var(--accent); }
      .layout-default:disabled { color: var(--muted); opacity: .6; }
      .layout-note { display: flex; gap: 8px; color: var(--muted); font-size: 11px; line-height: 1.8; padding: 1px 4px; align-items: flex-start; }
      .layout-note .icon { margin-top: 2px; width: 15px; height: 15px; }
      .layout-reset { justify-self: center; display: flex; align-items: center; gap: 6px; margin: 2px 0 8px; color: var(--muted); font-size: 11px; min-height: 40px; padding: 8px 14px; border-radius: 9px; }
      .layout-reset:hover { background: var(--quiet); }
      .layout-preview { min-height: 0; padding: 0; }
      .layout-preview .layout-chat-head { position: relative; z-index: 1; display: flex; align-items: center; padding: 11px 0 9px 15px; gap: 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
      .layout-chat-head > div { flex: 1; min-width: 0; display: grid; gap: 1px; }
      .layout-chat-head strong { font-size: 12px; font-weight: 600; }
      .layout-chat-head small { font-size: 9px; color: var(--muted); }
      .layout-settings-marker { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; color: var(--accent); background: var(--soft); border-radius: 10px; }
      .layout-conversation { position: relative; z-index: 1; padding-top: 16px; padding-bottom: 18px; }
      .layout-user-line { display: flex; justify-content: flex-end; margin-bottom: 14px; }
      .layout-user-line .bubble { font-size: 11px; max-width: 94%; padding: 9px 11px; }
      .layout-ai-line { display: flex; align-items: flex-start; gap: 8px; }
      .layout-ai-body { flex: 1; min-width: 0; }
      .layout-ai-body > .bubble { width: 100%; max-width: 100%; padding: 12px; }
      .layout-markdown { font-size: 12px; line-height: calc(1.65 * var(--layout-line)); letter-spacing: var(--layout-letter); overflow-wrap: anywhere; }
      .layout-markdown h3 { font-size: 1.12em; line-height: inherit; margin: 0 0 var(--layout-paragraph); }
      .layout-markdown p, .layout-markdown ul { margin: 0 0 var(--layout-paragraph); }
      .layout-markdown ul { padding-left: 1.35em; }
      .layout-markdown > :last-child { margin-bottom: 0; }
      .layout-markdown code { padding: 2px 4px; background: var(--quiet); border-radius: 4px; font-size: .9em; letter-spacing: 0; }
      .layout-markdown blockquote { margin: 0 0 var(--layout-paragraph); padding: 0 0 0 9px; border-left: 2px solid var(--accent); color: var(--muted); }
      .layout-preview-meta { color: var(--muted); font-size: 9px; margin-top: 7px; }
      .layout-preview .preview-input { position: relative; z-index: 1; margin: 0 12px 12px; }
      .layout-number-wrap { display: flex; align-items: center; gap: 10px; margin: 14px 0 9px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); padding: 10px 14px; }
      .layout-number-wrap:focus-within { border-color: var(--accent); }
      .layout-number-wrap input { width: 100%; min-width: 0; border: 0; outline: none; background: none; color: var(--ink); font-size: 25px; font-variant-numeric: tabular-nums; padding: 3px 0; }
      .layout-number-wrap span { font-size: 12px; color: var(--muted); }
      .layout-number-help { font-size: 11px; color: var(--muted); line-height: 1.8; }
      .layout-number-error { color: var(--danger); min-height: 25px; margin-top: 5px; font-size: 11px; }
      @media (max-width: 360px) {
        .tab-shell { padding-left: 12px; padding-right: 12px; }
        .tabs { gap: 4px; }
        .tab { padding-left: 7px; padding-right: 7px; }
        .layout-control { padding-left: 13px; padding-right: 13px; }
        .layout-range-foot { gap: 4px; }
      }
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
      <defs id="icon-defs"></defs>
    </svg>
    <div class="screen-cover" aria-hidden="true" id="page-wallpaper"></div>
    <header class="app-header">
      <div class="titlebar">
        <button
          class="icon-button"
          data-action="back"
          aria-label="返回主题概览"
          data-icon="back"
        ></button>
        <h1>主题与外观</h1>
        <span class="header-state" id="save-state"
          ><i class="state-dot"></i><span>已保存</span></span
        >
        <button
          class="icon-button"
          data-action="more"
          aria-label="更多主题操作"
          data-icon="more"
        ></button>
      </div>
      <button class="scope-picker" data-action="scope" aria-label="选择角色主题">
        <span class="avatar" id="scope-avatar"></span>
        <span class="scope-copy"
          ><span class="scope-name"><strong id="scope-name">Echo</strong><span>当前角色</span></span
          ><span class="scope-sub">独立保存外观，让每次对话都有自己的样子</span></span
        >
        <span data-icon="chevron-down"></span>
      </button>
      <div class="scope-picker layout-scope" id="layout-scope" hidden>
        <span class="avatar" data-icon="globe"></span>
        <span class="scope-copy"><span class="scope-name"><strong>聊天布局</strong><span>全局生效</span></span><span class="scope-sub">所有角色共用，调整留白与阅读节奏</span></span>
      </div>
    </header>
    <nav class="tab-shell" aria-label="外观设置分区">
      <div class="tabs" role="tablist">
        <button
          class="tab"
          role="tab"
          id="tab-theme"
          aria-controls="panel-theme"
          aria-selected="true"
          data-tab="theme"
        >
          主题
        </button>
        <button
          class="tab"
          role="tab"
          id="tab-background"
          aria-controls="panel-background"
          aria-selected="false"
          data-tab="background"
          tabindex="-1"
        >
          背景
        </button>
        <button
          class="tab"
          role="tab"
          id="tab-messages"
          aria-controls="panel-messages"
          aria-selected="false"
          data-tab="messages"
          tabindex="-1"
        >
          消息
        </button>
        <button
          class="tab"
          role="tab"
          id="tab-interface"
          aria-controls="panel-interface"
          aria-selected="false"
          data-tab="interface"
          tabindex="-1"
        >
          界面
        </button>
        <button class="tab" role="tab" id="tab-layout" aria-controls="panel-layout" aria-selected="false" data-tab="layout" tabindex="-1">布局</button>
      </div>
    </nav>
    <main class="workspace">
      <aside class="preview" aria-label="外观实时预览">
        <button
          class="preview-head"
          data-action="fold-preview"
          aria-expanded="true"
          aria-controls="inline-preview"
        >
          <span data-icon="eye"></span><strong>实时预览</strong
          ><span class="live-mark">随设置更新</span><span data-icon="chevron-up"></span>
        </button>
        <div id="inline-preview"></div>
      </aside>
      <div class="editor" id="editor">
        <section
          class="panel"
          id="panel-theme"
          role="tabpanel"
          aria-labelledby="tab-theme"
        ></section>
        <section
          class="panel"
          id="panel-background"
          role="tabpanel"
          aria-labelledby="tab-background"
          hidden
        ></section>
        <section
          class="panel"
          id="panel-messages"
          role="tabpanel"
          aria-labelledby="tab-messages"
          hidden
        ></section>
        <section
          class="panel"
          id="panel-interface"

          title = "主题操作";
          body =
            actionRow(
              "apply-all",
              "应用到全部角色",
              "把当前外观同步给其他角色",
              "",
              icon("users"),
            ) +
            actionRow("discard", "撤销未保存更改", "恢复上次保存的主题与全局设置", "", icon("reset")) +
            actionRow("reset", "重置当前主题", "恢复角色外观，保留全局聊天布局", "", icon("sliders"));
          footer = "";
        } else if (modal.type === "scope") {
          title = "选择角色主题";
          body =
            `<p class="hint">每个角色独立保存外观，切换不会修改当前使用的角色。</p>` +
            Object.entries(model.profiles)
              .map(
                ([id, p]) =>
                  `<button class="row choice-row" role="radio" aria-checked="${id === model.activeId}" data-scope="${id}"><span class="avatar">${icon("leaf")}</span><span class="row-copy"><span class="row-title">${esc(p.name)}</span><span class="row-sub" style="display:block">${modeLabel(p.theme.mode)} · ${presets.find((v) => v[0] === p.theme.palette)[1]}</span></span><span class="option-mark">${icon("check")}</span></button>`,
              )
              .join("");
          footer = "";
        } else if (modal.type === "confirm") {
          title = modal.title;
          body = `<p class="confirm-copy">${esc(modal.message)}</p>`;
          footer = `<button class="text-button" data-action="close-modal">取消</button><button class="primary" data-action="confirm-operation">${modal.label || "确定"}</button>`;
        } else if (modal.type === "unsaved") {
          title = "先保存当前更改？";
          body =
            '<p class="confirm-copy">角色主题或全局设置还有未保存的更改。可以保存后切换，也可以舍弃这次调整。</p>';
          footer =
            '<button class="text-button" data-action="switch-discard">舍弃更改</button><button class="primary" data-action="switch-save">保存并切换</button>';
        } else if (modal.type === "language") {
          title = "应用语言";
          body = `<p class="hint">这是全局设置，对所有角色生效。应用中切换后需重新打开。</p><div role="radiogroup" aria-label="应用语言">${choices("global.language", Object.entries(languages))}</div>`;
        } else if (modal.type === "font") {
          const which = modal.which,
            key = fontKey(which);
          title =
            which === "global" ? "界面字体" : which === "user" ? "用户消息字体" : "AI 消息字体";
          body =
            choices(key, [
              ["default", which === "global" ? "系统默认" : "跟随主题"],
              ["serif", "衬线字体", "适合长文阅读"],
              ["mono", "等宽字体", "让代码与数字排列整齐"],
              ["file", "自定义字体", get(fontFileKey(which)) || "选择 TTF、OTF 或 TTC 文件"],
            ]) +
            `<div class="body-pad"><button class="secondary" data-upload="${which}-font">${icon("upload", "small")}选择字体文件</button></div><p class="font-specimen" style="font-family:${fontCSS(get(key), which === "global" ? "" : which)}">把日常，调成喜欢的样子。<br><span>Operit · 0123456789</span></p>`;
        } else if (modal.type === "bubble") {
          title = modal.which === "user" ? "用户消息外观" : "AI 消息外观";
          body = bubbleEditor(modal.which);
        } else if (modal.type === "glass") {
          title = "玻璃参数";
          body =
            `<p class="hint">参数随当前主题保存，应用到已开启的玻璃区域。</p><div class="texture-sample"><span class="glass-demo">玻璃效果预览</span></div>` +
            range("glassBlur", "模糊半径", 0, 40, 1, " dp") +
            range("glassEdge", "边缘宽度", 0, 2, 0.1, " dp") +
            range("glassHighlight", "边缘高光", 0, 100) +
            range("glassShadow", "阴影半径", 0, 20, 1, " dp") +
            range("glassOpacity", "表面不透明度", 0, 100) +
            '<div class="body-pad"><button class="text-button" data-action="reset-glass">恢复默认玻璃参数</button></div>';
        } else if (modal.type === "input-glass") {
          title = "输入框质感";
          body =
            choices("inputGlass", [
              ["normal", "普通", "保持主题背景"],
              ["frosted", "磨砂玻璃", "柔和模糊背景"],
              ["water", "水玻璃", "增加通透与高光层次"],
            ]) + actionRow("glass", "调整共享玻璃参数", "", `${draft.glassBlur} dp`);
        } else if (modal.type === "sidebar-colors") {
          title = "侧栏与包管理配色";
          body =
            colorRow("sidebarColor", "侧栏背景", true) +
            colorRow("sidebarSelected", "侧栏选中背景", true) +
            colorRow("marketColor", "插件市场按钮", true) +
            colorRow("addColor", "添加插件按钮", true) +
            '<p class="hint">可以在聊天预览下方点击「看看侧栏」查看效果。</p>';
        } else if (modal.type === "crop") {
          title = "调整背景构图";
          body =
            `<div class="media-cover" id="crop-scene">${sceneHTML(true)}</div>` +
            range("cropZoom", "缩放", 100, 220) +
            range("cropX", "水平位置", 0, 100) +
            range("cropY", "垂直位置", 0, 100) +
            '<div class="body-pad"><button class="text-button" data-action="reset-crop">恢复居中</button></div>';
        } else if (modal.type === "avatars") {
          title = "头像与名称";
          body =
            segment(
              "avatarShape",
              [
                ["circle", "圆形"],
                ["square", "方形"],
              ],
              "头像形状",
            ) +
            (draft.avatarShape === "square"
              ? range("avatarCorner", "方形圆角", 0, 18, 1, " dp")
              : "") +
            `<div class="avatar-options"><div class="avatar-card">${avatarHTML("user")}<span>当前角色的用户头像</span><button class="text-button small-button" data-upload="user-avatar">更换</button><button class="text-button small-button" data-clear-avatar="userAvatar">恢复全局头像</button></div><div class="avatar-card">${avatarHTML("ai")}<span>当前角色的 AI 头像</span><button class="text-button small-button" data-upload="ai-avatar">更换</button><button class="text-button small-button" data-clear-avatar="aiAvatar">恢复默认</button></div></div>` +
            actionRow(
              "upload-global-avatar",
              "全局用户头像",
              "角色未单独设置时使用",
              common.avatar ? "已选择" : "默认",
            ) +
            `<div class="field"><label for="global-username">全局用户名称</label><input id="global-username" type="text" value="${esc(common.username)}" maxlength="30" data-text="global.username" placeholder="输入用户名称" /></div><p class="hint">用户名称与全局头像对所有角色生效。</p>`;
        } else if (modal.type === "preview") {
          title = "外观预览";
          body = currentTab === "layout" ? layoutPreviewHTML() : previewHTML(true);
          footer = `<button class="text-button" data-action="preview-cycle">${icon("reset", "small")}换一段对话</button><button class="primary" data-action="close-modal">完成</button>`;
        }
        $("modal-title").textContent = title;
        $("modal-body").innerHTML = body;
        $("modal-footer").innerHTML = footer;
        $("modal-footer").hidden = !footer;
        $("modal-body").scrollTop = oldScroll;
      }
      // 修改只更新草稿；保存和批量应用明确写入浏览器的本地存储。
      function save(all = false) {
        const next = clone(model);
        next.common = clone(common);
        if (all)
          Object.values(next.profiles).forEach((p) => {
            p.theme = clone(draft);
          });
        else next.profiles[next.activeId].theme = clone(draft);
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(next));
        } catch (error) {
          console.error("保存主题原型失败", error);
          notify("未能保存，请检查浏览器存储或减小媒体文件");
          return false;
        }
        model = next;
        snapshot = JSON.stringify({ draft, common });
        syncStatus();
        notify(
          all
            ? `已应用到 ${Object.keys(model.profiles).length} 个示例角色`
            : "主题已保存在当前浏览器",
        );
        return true;
      }
      function switchScope(id) {
        model.activeId = id;
        draft = clone(model.profiles[id].theme);
        common = clone(model.common);
        snapshot = JSON.stringify({ draft, common });
        previewSidebar = false;
        closeModal();
        render();
        installStoredFonts();
      }
      function setTab(tab, scroll = true) {
        currentTab = tab;
        applyVisuals();
        renderPreview();
        syncStatus();
        hydrateIcons();
        document.querySelectorAll("[data-tab]").forEach((el) => {
          const active = el.dataset.tab === tab;
          el.setAttribute("aria-selected", String(active));
          el.tabIndex = active ? 0 : -1;
        });
        document.querySelectorAll('[role="tabpanel"]').forEach((el) => {
          el.hidden = el.id !== "panel-" + tab;
        });
        if (scroll) {
          const top = document.querySelector(".app-header").offsetHeight;
          if (window.scrollY > top) window.scrollTo({ top, behavior: "smooth" });
        }
      }
      function choosePreset(id) {
        const p = presets.find((value) => value[0] === id);
        draft.palette = id;
        if (!draft.userCustom) {
          draft.userColor = p[4];
          draft.userText = p[5];
        }
        render();
      }
      async function installFont(which, data) {
        if (!data) return;
        const prefix = which === "global" ? "" : which;
        if (fontFaces.get(prefix) === data) return;
        const face = new FontFace("ThemeFont" + prefix, `url(${data})`);
        await face.load();
        document.fonts.add(face);
        fontFaces.set(prefix, data);
      }
      function installStoredFonts() {
        ["global", "user", "ai"].forEach((which) => {
          const data = get(fontDataKey(which));
          if (data)
            installFont(which, data)
              .then(() => {
                applyVisuals();
                renderPreview();
              })
              .catch((error) => {
                console.error("加载已保存字体失败", error);
                notify("字体未能加载，可重新选择文件");
              });
        });
      }
      function chooseFile(kind) {
        fileRequest = { kind, profileId: model.activeId };
        const picker = $("file-picker");
        picker.accept = kind.endsWith("-font")
          ? ".ttf,.otf,.ttc"
          : kind === "background-video"
            ? "video/*"
            : "image/*";
        picker.value = "";
        picker.click();
      }
      $("file-picker").addEventListener("change", async (event) => {
        const file = event.target.files[0],
          request = fileRequest;
        if (!file || !request) return;
        if (request.profileId !== model.activeId) {
          notify("已切换角色，请重新选择文件");
          return;
        }
        const kind = request.kind;
        if (file.size > 12 * 1024 * 1024) {
          notify("预览文件请控制在 12 MB 内");
          return;
        }
        if (
          kind.endsWith("-font")
            ? !/[.](ttf|otf|ttc)$/i.test(file.name)
            : kind === "background-video"
              ? !file.type.startsWith("video/")
              : !file.type.startsWith("image/")
        ) {
          notify("文件格式不匹配，请重新选择");
          return;
        }
        try {
          const data = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error);
            reader.readAsDataURL(file);
          });
          if (request.profileId !== model.activeId) return;
          if (kind.endsWith("-font")) {
            const which = kind.slice(0, -5);
            await installFont(which, data);
            put(fontDataKey(which), data);
            put(fontFileKey(which), file.name);
            put(fontKey(which), "file");
          } else if (kind.startsWith("background-")) {
            Object.assign(draft, {
              background: true,
              mediaType: kind === "background-video" ? "video" : "image",
              mediaData: data,
              mediaName: file.name,
              cropZoom: 100,
              cropX: 50,
              cropY: 50,
            });
          } else if (kind === "global-avatar") common.avatar = data;
          else if (kind.endsWith("-avatar"))
            draft[kind.startsWith("user") ? "userAvatar" : "aiAvatar"] = data;
          else {
            const who = kind.split("-")[0];
            draft[who + "Image"] = data;
            draft[who + "ImageName"] = file.name;
          }
          render();
          notify("已载入 " + file.name);
        } catch (error) {
          console.error("载入预览素材失败", error);
          notify("文件无法载入，请换一个文件重试");
        }
      });
      const actions = {
        back: () => {
          closeModal();
          setTab("theme");
          window.scrollTo({ top: 0, behavior: "smooth" });
        },
        more: () => openModal("more"),
        scope: () => openModal("scope"),
        language: () => openModal("language"),
        avatars: () => openModal("avatars"),
        glass: () => openModal("glass"),
        crop: () => openModal("crop"),
        "input-glass": () => openModal("input-glass"),
        "sidebar-colors": () => openModal("sidebar-colors"),
        "font-global": () => openModal("font", { which: "global" }),
        "font-user": () => openModal("font", { which: "user" }),
        "font-ai": () => openModal("font", { which: "ai" }),
        "bubble-user": () => openModal("bubble", { which: "user" }),
        "bubble-ai": () => openModal("bubble", { which: "ai" }),
        "upload-global-avatar": () => chooseFile("global-avatar"),
        "close-modal": () => closeModal(),
        save: () => save(),
        "full-preview": () => openModal("preview"),
        "fold-preview": () => {
          previewOpen = !previewOpen;
          renderPreview();
          hydrateIcons();
        },
        "fold-display": () => {
          displayOpen = !displayOpen;
          renderPanels();
        },
        "preview-cycle": () => {
          sampleIndex++;
          renderPreview();
        },
        "preview-sidebar": () => {
          previewSidebar = !previewSidebar;
          renderPreview();
        },
        "preview-meta": () => {
          previewDetails = !previewDetails;
          renderPreview();
        },
        "preview-thinking": () => {
          previewThinking = !previewThinking;
          renderPreview();
        },
        "preview-send": () => {
          if (previewRunning) return;
          previewRunning = true;
          renderPreview();
          setTimeout(() => {
            previewRunning = false;
            sampleIndex++;
            renderPreview();
          }, 1000);
        },
        "clear-background": () => {
          Object.assign(draft, {
            mediaType: "image",
            mediaData: "",
            mediaName: "林间光影",
            cropZoom: 100,
            cropX: 50,
            cropY: 50,
          });
          render();
        },
        "apply-layout-number": () => {
          const field = layoutFields[modal.key], input = $("layout-number-input"), text = input.value.trim();
          const value = Number(text);
          if (!/^-?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)$/.test(text) || !Number.isFinite(value) || value < field.min || value > field.max) {
            input.setAttribute("aria-invalid", "true");
            $("layout-number-error").textContent = `请输入 ${layoutNumber(field.min)}–${layoutNumber(field.max)} 之间的数值。`;
            input.focus();
            return;
          }
          const key = modal.key;
          closeModal();
          change("layout." + key, value);
        },
        "reset-layout": () => openModal("confirm", {
          title: "恢复布局默认值？",
          message: "恢复聊天间距与 AI 回复排版的五项参数。角色配色、背景、头像和消息内容保持原样。保存更改后对所有角色生效。",
          operation: "reset-layout",
          label: "恢复默认",
        }),
        "reset-crop": () => {
          Object.assign(draft, { cropZoom: 100, cropX: 50, cropY: 50 });
          render();
        },
        "reset-glass": () => {
          ["glassBlur", "glassEdge", "glassHighlight", "glassShadow", "glassOpacity"].forEach(
            (key) => {
              draft[key] = defaults[key];
            },
          );
          render();
        },
        "apply-all": () =>
          openModal("confirm", {
            title: "应用到全部角色？",
            message: "当前的主题、背景和消息外观将同步到全部示例角色。",
            operation: "apply-all",
            label: "应用并保存",
          }),
        discard: () =>
          openModal("confirm", {
            title: "撤销当前更改？",
            message: "恢复当前角色上一次保存的主题及尚未保存的全局设置。",
            operation: "discard",
            label: "撤销更改",
          }),
        reset: () =>
          openModal("confirm", {
            title: "重置当前角色主题？",
            message: "当前角色外观将恢复默认。全局布局、头像、用户名和语言会保留。",
            operation: "reset",
            label: "重置主题",
          }),
        "confirm-operation": () => {
          const operation = modal.operation;
          if (operation === "apply-all") {
            if (save(true)) {
              closeModal();
              render();
            }
          }
          if (operation === "discard") {
            draft = clone(model.profiles[model.activeId].theme);
            common = clone(model.common);
            closeModal();
            render();
          }
          if (operation === "reset-layout") {
            common.layout = clone(layoutDefaults);
            closeModal();
            render();
            notify("布局已恢复默认，保存后对所有角色生效");
          }
          if (operation === "reset") {
            draft = clone(defaults);
            closeModal();
            render();
            notify("已恢复默认，保存后生效");
          }
        },
        "switch-discard": () => switchScope(modal.target),
        "switch-save": () => {
          const target = modal.target;
          if (save()) switchScope(target);
        },
      };
      document.addEventListener("click", (event) => {
        const el = event.target.closest("button");
        if (!el || el.disabled) return;
        if (el.dataset.tab) {
          setTab(el.dataset.tab);
          return;
        }
        if (el.dataset.toggle) {
          change(el.dataset.toggle, !get(el.dataset.toggle));
          return;
        }
        if (el.dataset.set) {
          change(el.dataset.set, el.dataset.value);
          return;
        }
        if (el.dataset.palette) {
          choosePreset(el.dataset.palette);
          return;
        }
        if (el.dataset.choice) {
          if (el.dataset.value === "file" && !get(fontDataKey(modal.which))) {
            chooseFile(modal.which + "-font");
            return;
          }
          change(el.dataset.choice, el.dataset.value);
          return;
        }
        if (el.dataset.upload) {
          chooseFile(el.dataset.upload);
          return;
        }
        if (el.dataset.scope) {
          if (el.dataset.scope === model.activeId) closeModal();
          else if (dirty()) openModal("unsaved", { target: el.dataset.scope });
          else switchScope(el.dataset.scope);
          return;
        }
        if (el.dataset.editLayout) {
          openModal("layout-number", { key: el.dataset.editLayout });
          $("layout-number-input").focus();
          $("layout-number-input").select();
          return;
        }
        if (el.dataset.resetLayout) {
          const key = el.dataset.resetLayout;
          change("layout." + key, layoutFields[key].value);
          return;
        }
        if (el.dataset.resetColor) {
          change(el.dataset.resetColor, defaults[el.dataset.resetColor]);
          return;
        }
        if (el.dataset.clearImage) {
          const who = el.dataset.clearImage;
          draft[who + "Image"] = "";
          draft[who + "ImageName"] = "";
          render();
          return;
        }
        if (el.dataset.clearAvatar) {
          change(el.dataset.clearAvatar, "");
          return;
        }
        if (el.dataset.action) actions[el.dataset.action]();
      });
      document.addEventListener("input", (event) => {
        const el = event.target;
        if (el.id === "layout-number-input") {
          el.removeAttribute("aria-invalid");
          $("layout-number-error").textContent = "";
        }
        if (el.dataset.range) change(el.dataset.range, Number(el.value), false);
        if (el.dataset.color) change(el.dataset.color, el.value, false);
        if (el.dataset.text) change(el.dataset.text, el.value, false);
        if (el.dataset.hex) {
          const valid = /^#[0-9a-f]{6}$/i.test(el.value);
          el.setAttribute("aria-invalid", String(!valid));
          if (valid) change(el.dataset.hex, el.value, false);
        }
      });
      $("modal-overlay").addEventListener("click", (event) => {
        if (event.target === $("modal-overlay")) closeModal();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && modal?.type === "layout-number" && event.target.id === "layout-number-input") {
          event.preventDefault();
          actions["apply-layout-number"]();
          return;
        }
        if (event.key === "Escape" && modal) {
          closeModal();
          return;
        }
        if (modal && event.key === "Tab") {
          const focusable = Array.from(
            $("modal-overlay").querySelectorAll('button, input, select, [tabindex="0"]'),
          ).filter((el) => !el.disabled && !el.closest("[hidden]"));
          const first = focusable[0],
            last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
        const tab = event.target.closest("[data-tab]");
        if (tab && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) {
          event.preventDefault();
          const tabs = Array.from(document.querySelectorAll("[data-tab]"));
          const index = tabs.indexOf(tab),
            next =
              event.key === "Home"
                ? 0
                : event.key === "End"
                  ? tabs.length - 1
                  : (index + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
          setTab(tabs[next].dataset.tab);
          tabs[next].focus();
        }
      });
      window.addEventListener("beforeunload", (event) => {
        if (dirty()) {
          event.preventDefault();
          event.returnValue = "";
        }
      });
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
        if (draft.mode === "system") render();
      });
      render();
      setTab("layout", false);
      installStoredFonts();
      if (storageIssue) notify(storageIssue);
    </script>
  </body>
</html>

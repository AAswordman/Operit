<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#10171b" />
    <title>Operit · 语音服务 · 交互设计稿</title>
    <style>
      /* 沿用现有工作区的紧凑行、低对比表面和主题色，不引入供应商总览首页。 */
      :root {
        color-scheme: dark;
        --bg: #10171b;
        --surface: #192227;
        --raised: #202c33;
        --ink: #e5edf1;
        --muted: #9aabb5;
        --line: #303e46;
        --accent: #91cbe9;
        --on-accent: #103548;
        --soft: #243d4b;
        --quiet: #152027;
        --track: #3d4d57;
        --danger: #f3ada7;
        --good: #a2cdbd;
        --shade: #0008;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "Noto Sans CJK SC",
          "Microsoft YaHei",
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      html[data-theme="light"] {
        color-scheme: light;
        --bg: #f4f7f9;
        --surface: #fff;
        --raised: #edf3f6;
        --ink: #26343d;
        --muted: #667b88;
        --line: #dce5eb;
        --accent: #326e8b;
        --on-accent: #fff;
        --soft: #e1eff7;
        --quiet: #f4f8fa;
        --track: #d0dde5;
        --danger: #ae4941;
        --good: #386f5c;
        --shade: #142b4055;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scrollbar-gutter: stable;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-size: 14px;
        line-height: 1.5;
      }
      body:has(dialog[open]) {
        overflow: hidden;
      }
      [hidden] {
        display: none !important;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
        background: none;
        border: 0;
        touch-action: manipulation;
      }
      button:disabled,
      input:disabled,
      select:disabled,
      textarea:disabled {
        cursor: default;
        opacity: 0.42;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.4px;
      }
      h2 {
        font-size: 14px;
        font-weight: 620;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
      }
      .icon {
        width: 20px;
        height: 20px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: middle;
      }
      .small-icon {
        width: 16px;
        height: 16px;
      }
      .shell {
        width: min(100%, 640px);
        margin: auto;
      }
      .previewbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 22px;
        border-bottom: 1px solid var(--line);
        font-size: 10px;
        letter-spacing: 0.03em;
        color: var(--muted);
      }
      .previewbar button {
        padding: 4px 0;
        color: var(--accent);
        font-size: 11px;
      }
      .header {
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 5;
        padding: env(safe-area-inset-top) 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .titlebar {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 64px;
      }
      .titlebar h1 {
        flex: 1;
      }
      .iconbtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        flex: none;
      }
      .iconbtn:hover {
        background: var(--raised);
      }
      .draft-state {
        font-size: 10px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .draft-state:before {
        content: "";
        width: 5px;
        height: 5px;
        background: var(--good);
        border-radius: 50%;
      }
      .tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 3px;
      }
      .tab {
        height: 51px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 560;
      }
      .tab small {
        font-size: 10px;
        font-weight: 450;
        letter-spacing: 0.03em;
      }
      .tab[aria-selected="true"] {
        color: var(--accent);
      }
      .tab[aria-selected="true"]:after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 23%;
        right: 23%;
        height: 3px;
        border-radius: 3px 3px 0 0;
        background: var(--accent);
      }
      main {
        padding: 20px 20px 0;
      }
      .section-kicker {
        font-size: 11px;
        color: var(--muted);
        padding: 0 2px 9px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .section-kicker b {
        color: var(--accent);
        font-weight: 500;
        font-size: 10px;
      }
      .profile {
        display: flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        margin-bottom: 21px;
      }
      .profile-main {
        flex: 1;
        display: flex;
        gap: 13px;
        align-items: center;
        min-width: 0;
        padding: 15px;
        text-align: left;
      }
      .profile-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--soft);
        color: var(--accent);
        width: 42px;
        height: 42px;
        border-radius: 12px;
        flex: none;
      }
      .profile-name {
        font-size: 15px;
        font-weight: 600;
        display: block;
        overflow-wrap: anywhere;
      }
      .profile-sub {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 4px;
      }
      .profile .iconbtn {
        margin-right: 6px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 7px;
        border-radius: 5px;
        background: var(--soft);
        color: var(--accent);
        font-size: 10px;
        font-weight: 500;
        white-space: nowrap;
      }
      .badge.quiet {
        background: var(--raised);
        color: var(--muted);
      }
      .badge.demo {
        font-size: 9px;
        letter-spacing: 0.05em;
      }
      .heading {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 2px 9px;
      }
      .heading > .icon {
        width: 17px;
        height: 17px;
        color: var(--accent);
      }
      .heading .tail {
        margin-left: auto;
        color: var(--muted);
        font-size: 10px;
      }
      .card {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 14px;
        margin-bottom: 19px;
        overflow: hidden;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 14px 15px;
        min-height: 63px;
        text-align: left;
      }
      .row + .row,
      .separated {
        border-top: 1px solid var(--line);
      }
      .row.clickable:hover {
        background: var(--raised);
      }
      .copy {
        flex: 1;
        min-width: 0;
      }
      .row-title {
        display: block;
        font-size: 13px;
        font-weight: 520;
      }
      .row-desc {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
        line-height: 1.55;
      }
      .row-value {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 7px;
        color: var(--accent);
        font-size: 12px;
        max-width: 57%;
        text-align: right;
        overflow-wrap: anywhere;
      }
      .chevron {
        color: var(--muted);
        width: 16px;
        height: 16px;
      }
      .engine-note {
        padding: 0 15px 13px;
        display: flex;
        gap: 7px;
        align-items: flex-start;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
      }
      .engine-note .icon {
        width: 14px;
        height: 14px;
        margin-top: 2px;
      }
      .fields {
        padding: 2px 15px 15px;
      }
      .field {
        display: block;
        margin-top: 13px;
      }
      .field > span:first-child {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 7px;
      }
      .field input,
      .field select,
      .field textarea,
      .text-input {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--quiet);
        color: var(--ink);
        padding: 11px 12px;
        line-height: 1.5;
        outline-offset: 2px;
      }
      .field textarea {
        resize: vertical;
        min-height: 95px;
        font-size: 12px;
      }
      .field input::placeholder,
      .field textarea::placeholder {
        color: var(--muted);
        opacity: 0.7;
      }
      .field select {
        padding-right: 26px;
        cursor: pointer;
      }
      .input-action {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .input-action input {
        flex: 1;
        min-width: 0;
      }
      .input-action .iconbtn {
        width: 39px;
        height: 39px;
        border: 1px solid var(--line);
        border-radius: 9px;
        color: var(--accent);
      }
      .helper {
        font-size: 10px;
        color: var(--muted);
        line-height: 1.65;
        margin-top: 7px;
      }
      .voice-value {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1;
      }
      .voice-symbol {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        color: var(--accent);
        background: var(--soft);
        border-radius: 9px;
      }
      .sliders {
        padding: 15px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
      }
      .slider-top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        margin-bottom: 12px;
      }
      .slider-top output {
        font-variant-numeric: tabular-nums;
        font-size: 11px;
        color: var(--accent);
      }
      input[type="range"] {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        height: 4px;
        margin: 9px 0 7px;
        border-radius: 3px;
        background: linear-gradient(
          to right,
          var(--accent) 0%,
          var(--accent) var(--fill, 33.33%),
          var(--track) var(--fill, 33.33%),
          var(--track) 100%
        );
        accent-color: var(--accent);
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: var(--accent);
        border: 3px solid var(--surface);
        box-shadow: 0 0 0 1px var(--accent);
      }
      input[type="range"]::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        border: 2px solid var(--surface);
      }
      .scale {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 9px;
      }
      .fold > summary {
        padding: 14px 15px;
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 61px;
      }
      .fold > summary::-webkit-details-marker {
        display: none;
      }
      .fold > summary .chevron {
        margin-left: auto;
        transition: transform 0.15s;
      }
      .fold[open] > summary .chevron {
        transform: rotate(90deg);
      }
      .fold-content {
        border-top: 1px solid var(--line);
        padding: 0 15px 15px;
      }
      .cleaner-row {
        display: flex;
        align-items: center;
        gap: 6px;
        border-bottom: 1px solid var(--line);
        padding: 7px 0;
      }
      .cleaner-pattern {
        flex: 1;
        min-width: 0;
        text-align: left;
        padding: 8px 0;
      }
      .cleaner-row code {
        font-size: 11px;
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
        color: var(--muted);
      }
      .cleaner-row .iconbtn {
        width: 35px;
        height: 35px;
      }
      .linkbtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: var(--accent);
        min-height: 40px;
        font-size: 12px;
        padding: 8px 10px;
        border-radius: 8px;
      }
      .linkbtn:hover {
        background: var(--soft);
      }
      .linkbtn.danger {
        color: var(--danger);
      }
      .test-body {
        padding: 15px;
      }
      .test-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 13px;
      }
      .test-title .badge {
        margin-left: auto;
      }
      .test-title .icon {
        color: var(--accent);
      }
      .test-text {
        resize: vertical;
        min-height: 85px;
        font-size: 13px;
        margin: 0 0 13px;
      }
      .primary,
      .secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 43px;
        border-radius: 10px;
        padding: 10px 17px;
        font-size: 13px;
        font-weight: 550;
      }
      .primary {
        background: var(--accent);
        color: var(--on-accent);
      }
      .secondary {
        border: 1px solid var(--line);
        color: var(--ink);
        background: var(--raised);
      }
      .wide {
        width: 100%;
      }
      .audio-demo {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
        margin: 0 0 13px;
        padding: 0 3px;
      }
      .audio-demo small {
        color: var(--muted);
        font-size: 10px;
      }
      .waveform {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        height: 34px;
        flex: 1;
        max-width: 200px;
        color: var(--accent);
      }
      .waveform i {
        display: block;
        width: 3px;
        border-radius: 3px;
        height: var(--bar);
        background: currentColor;
        opacity: 0.42;
      }
      .playing .waveform i {
        animation: pulse 0.85s ease-in-out infinite alternate;
        animation-delay: var(--delay);
        opacity: 0.9;
      }
      @keyframes pulse {
        from {
          transform: scaleY(0.35);
        }
        to {
          transform: scaleY(1);
        }
      }
      .test-note {
        color: var(--muted);
        font-size: 10px;
        line-height: 1.6;
        margin-top: 10px;
        text-align: center;
      }
      .switch {
        appearance: none;
        -webkit-appearance: none;
        position: relative;
        flex: none;
        width: 39px;
        height: 23px;
        background: var(--track);
        border: 1px solid var(--track);
        border-radius: 20px;
        margin: 0;
        cursor: pointer;
        transition: background 0.15s;
      }
      .switch:before {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 17px;
        height: 17px;
        background: var(--muted);
        border-radius: 50%;
        transition: transform 0.15s;
      }
      .switch:checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      .switch:checked:before {
        transform: translateX(16px);
        background: var(--on-accent);
      }
      .mic-zone {
        text-align: center;
        padding: 18px 0 13px;
      }
      .mic-orb {
        display: grid;
        place-items: center;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: var(--soft);
        color: var(--accent);
        margin: 0 auto 11px;
        position: relative;
      }
      .mic-orb .icon {
        width: 26px;
        height: 26px;
      }
      .mic-zone.recording .mic-orb:after {
        content: "";
        position: absolute;
        inset: -7px;
        border: 1px solid var(--accent);
        border-radius: 50%;
        animation: ripple 1.5s infinite;
      }
      .mic-label {
        font-size: 12px;
      }
      .mic-hint {
        font-size: 10px;
        color: var(--muted);
        margin-top: 5px;
      }
      .result {
        margin-top: 14px;
        border-radius: 10px;
        background: var(--quiet);
        padding: 13px;
        min-height: 86px;
      }
      .result-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .result-head .iconbtn {
        width: 30px;
        height: 30px;
      }
      .result p {
        font-size: 13px;
        line-height: 1.8;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .placeholder {
        color: var(--muted);
      }
      .state-line {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 10px;
        padding: 0 2px 13px;
      }
      .state-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--good);
      }
      .error {
        color: var(--danger);
        font-size: 11px;
        line-height: 1.65;
        margin-top: 9px;
      }
      .errorbox {
        padding: 11px 13px;
        border: 1px solid var(--danger);
        background: var(--quiet);
        border-radius: 9px;
        margin: 12px 0;
        font-size: 11px;
        color: var(--danger);
      }
      .wake-banner {
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 14px;
        margin-bottom: 18px;
      }
      .wake-banner .row {
        min-height: 82px;
      }
      .wake-banner .row-title {
        font-size: 15px;
      }
      .wake-banner .icon {
        color: var(--accent);
      }
      .segments {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        background: var(--quiet);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 4px;
        margin: 14px 15px 0;
      }
      .segments button {
        min-height: 39px;
        font-size: 12px;
        border-radius: 6px;
        color: var(--muted);
      }
      .segments button[aria-checked="true"] {
        background: var(--soft);
        color: var(--accent);
        font-weight: 550;
      }
      .embedded {
        padding: 0 15px 14px;
      }
      .embedded .field {
        margin-top: 14px;
      }
      .compact-row {
        min-height: 58px;
        padding: 13px 0;
      }
      .personal-samples {
        display: flex;
        gap: 8px;
        margin: 14px 0 12px;
      }
      .sample {
        flex: 1;
        padding: 11px 6px;
        text-align: center;
        border: 1px dashed var(--line);
        border-radius: 10px;
        color: var(--muted);
        font-size: 11px;
      }
      .sample.done {
        border-style: solid;
        background: var(--soft);
        color: var(--accent);
      }
      .sample .icon {
        width: 17px;
        height: 17px;
        display: block;
        margin: 0 auto 5px;
      }
      .two-actions {
        display: flex;
        gap: 8px;
      }
      .two-actions > * {
        flex: 1;
      }
      .attachments {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        padding: 2px 13px 15px;
      }
      .attach-tile {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        min-height: 100px;
        padding: 14px 3px 9px;
        background: var(--quiet);
        border: 1px solid var(--line);
        border-radius: 10px;
        text-align: center;
      }
      .attach-tile[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--soft);
      }
      .attach-tile > .icon {
        color: var(--accent);
      }
      .attach-tile strong {
        font-size: 11px;
        font-weight: 550;
      }
      .attach-tile small {
        font-size: 9px;
        line-height: 1.4;
        color: var(--muted);
        max-width: 100%;
        overflow-wrap: anywhere;
      }
      .attach-tile .tick {
        position: absolute;
        top: 6px;
        right: 6px;
        font-size: 9px;
        color: var(--accent);
      }
      .attachment-hint {
        padding: 0 15px 12px;
        color: var(--muted);
        font-size: 10px;
      }
      .assist-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: var(--accent);
        padding: 0 0 18px;
        min-height: 40px;
        font-size: 12px;
        width: 100%;

      .muted {
        color: var(--muted);
      }

        color: var(--accent);
        font-size: 11px;
        min-height: 40px;
      }

        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        padding: 0;
        width: min(520px, calc(100% - 28px));
        max-height: min(84dvh, 840px);
        border-radius: 20px;
        box-shadow: 0 20px 90px var(--shade);
        overflow: auto;
        overscroll-behavior: contain;
      }

        background: #040c1177;
        backdrop-filter: blur(3px);
      }

        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 13px 10px 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        z-index: 2;
      }
      .sheet-header h2 {
        flex: 1;
        font-size: 16px;
      }
      .sheet-content {
        padding: 16px 20px 20px;
      }
      .sheet-description {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
        margin-bottom: 12px;
      }
      .choice {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 65px;
        border-radius: 10px;
        padding: 12px;
        text-align: left;
      }
      .choice:hover {
        background: var(--raised);
      }
      .choice[aria-pressed="true"] {
        background: var(--soft);
        color: var(--accent);
      }
      .choice > .copy strong {
        display: block;
        font-size: 13px;
        font-weight: 550;
      }
      .choice > .copy small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 4px;
        line-height: 1.5;
      }
      .choice > .icon {
        width: 19px;
        height: 19px;
        color: var(--accent);
      }
      .choice-group {
        color: var(--muted);
        font-size: 10px;
        padding: 16px 12px 6px;
      }
      .sheet-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
      }
      .sheet-actions button {
        min-width: 80px;
      }
      .sheet-search {
        margin-bottom: 9px;
        font-size: 13px;
      }
      .checkrow {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        font-size: 12px;
        min-height: 43px;
        margin-top: 9px;
      }
      .checkrow input {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
      }
      .danger-text {
        color: var(--danger) !important;
      }
      .toast {
        position: fixed;
        bottom: max(25px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100% - 40px);
        padding: 12px 17px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--raised);
        color: var(--ink);
        font-size: 12px;
        box-shadow: 0 8px 24px var(--shade);
        z-index: 100;
        text-align: center;
        pointer-events: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @keyframes ripple {
        from {
          transform: scale(0.9);
          opacity: 0.8;
        }
        to {
          transform: scale(1.22);
          opacity: 0;
        }
      }
      @media (max-width: 600px) {
        .sheet {
          position: fixed;
          top: auto;
          bottom: 0;
          margin: 0 auto;
          width: 100%;
          max-height: 88dvh;
          border-radius: 21px 21px 0 0;
          border-bottom: 0;
          padding-bottom: env(safe-area-inset-bottom);
        }
        .sheet-header:before {
          content: "";
          position: absolute;
          top: 7px;
          left: calc(50% - 16px);
          width: 32px;
          height: 3px;
          background: var(--track);
          border-radius: 3px;
        }
        .sheet-header {
          padding-top: 20px;
        }
      }
      @media (min-width: 800px) {
        body {
          background: var(--quiet);
        }
        .shell {
          margin: 30px auto;
          border: 1px solid var(--line);
          border-radius: 20px;
          background: var(--bg);
          overflow: clip;
          min-height: calc(100vh - 60px);
        }
        .header {
          top: 0;
        }
        .previewbar {
          border-radius: 20px 20px 0 0;
        }
      }
      @media (max-width: 359px) {
        main {
          padding: 17px 14px 0;
        }
        .header {
          padding-left: 10px;
          padding-right: 10px;
        }
        .draft-state {
          display: none;
        }
        .tab {
          gap: 5px;
          font-size: 12px;
        }
        .tab small {
          font-size: 9px;
        }
        .sliders {
          gap: 14px;
        }
        .attachments {
          gap: 5px;
          padding-left: 10px;
          padding-right: 10px;
        }
        .row-value {
          max-width: 55%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>

      function field(

      ) {
        const id = `field-${scope}-${key}`;

          },
          {
            search: true,
            description:
              e.id === "system"
                ? "原生页面显示此设备实际安装的音色；当前为交互示例。"
                : "原生页面读取服务支持的音色；当前展示示例条目。",
            footer:
              '<button class="linkbtn wide" data-action="manual-voice">手动填写音色 ID</button>',
          },
        );
      }
      function manualVoice() {
        formSheet(
          "音色 ID",
          `<label class="field"><span>音色 ID</span><input id="manual-voice" value="${h(config("tts").voice)}" placeholder="填写音色 ID"></label>`,
          () => {
            config("tts").voice = $("#manual-voice").value.trim();
            closeSheet();
            updated();
            render();
            return true;
          },
        );
      }
      function chooseModel() {
        const e = engineInfo(),
          c = config();
        choiceSheet(
          "选择模型",
          [
            {
              id: e.model || "model-example",
              name: e.model || "model-example",
              desc: "示例模型，可手动填写其他名称",
              selected: c.model === (e.model || "model-example"),
            },
            {
              id: "custom-model-example",
              name: "custom-model-example",
              desc: "自定义接口返回的模型示例",
              selected: c.model === "custom-model-example",
            },
          ],
          (item) => {
            c.model = item.id;
            closeSheet();
            updated();
            render();
          },
          {
            search: true,
            description: "交互稿仅演示模型选择，不从服务端获取列表。",
          },
        );
      }
      function addCleaner(index = null) {
        formSheet(
          index === null ? "添加清理规则" : "编辑清理规则",
          `<label class="field"><span>正则表达式</span><textarea id="new-cleaner" spellcheck="false" placeholder="匹配需要在朗读前移除的文本">${index === null ? "" : h(current("tts").cleaners[index])}</textarea></label>`,
          () => {
            const value = $("#new-cleaner").value.trim();
            if (!value) return errorForm("请输入正则表达式。");
            try {
              validatePattern(value);
            } catch (error) {
              return errorForm("正则表达式无效：" + error.message);
            }
            if (index === null) current("tts").cleaners.push(value);
            else current("tts").cleaners[index] = value;
            closeSheet();
            updated();
            render();
            return true;
          },
        );
      }
      // Kotlin 支持内联标志；预览只校验浏览器可表达的同类标志。
      function validatePattern(value) {
        const prefix = value.match(/^\(\?([ims]+)\)/);
        return new RegExp(
          prefix ? value.slice(prefix[0].length) : value,
          prefix ? prefix[1] : "",
        );
      }
      function attachment(index) {
        const item = state.wake.attachments[index];
        formSheet(
          item.name + "关键词",
          `<label class="checkrow"><input id="attach-enabled" type="checkbox" ${item.enabled ? "checked" : ""}>启用${item.name}附件</label><label class="field"><span>触发词，用逗号分隔</span><input id="attach-keywords" value="${h(item.keywords)}" placeholder="例如：时间,几点"></label><p class="helper">命中任一关键词时附带对应信息。</p>`,
          () => {
            const words = $("#attach-keywords")
              .value.split(/[,，]/)
              .map((word) => word.trim())
              .filter(Boolean);
            if (!words.length) return errorForm("请至少填写一个触发词。");
            item.keywords = [...new Set(words)].join(",");
            item.enabled = $("#attach-enabled").checked;
            closeSheet();
            updated();
            render();
            return true;
          },
        );
      }
      function demoError(kind) {
        if (state.demoOutcome === "permission" && kind === "stt") {
          return "演示：麦克风权限未授予。原生页面将在这里提供授权入口。";
        }
        if (state.demoOutcome === "unavailable") {
          return "演示：语音服务暂不可用，请检查当前档案的引擎或连接配置。";
        }
        return "";
      }
      function testTts() {
        if (demo.kind === "tts") {
          stopDemo();
          render();
          return;
        }
        if (!state.testText.trim()) {
          toast("先写一段想试听的文字");
          return;
        }
        stopDemo();
        demo.error = demoError("tts");
        if (demo.error) {
          render();
          return;
        }
        demo.kind = "tts";
        render();
        demoTimer = setTimeout(() => {
          demo.kind = null;
          demoTimer = null;
          render();
          toast("试听状态演示结束");
        }, 3500);
      }
      function testStt() {
        if (demo.kind === "stt") {
          clearInterval(demoTimer);
          demoTimer = null;
          demo.kind = null;
          demo.text = "你好，小欧。帮我看看今天的安排。";
          render();
          return;
        }
        stopDemo();
        demo.error = demoError("stt");
        if (demo.error) {
          render();
          return;
        }
        demo.kind = "stt";
        render();
        demoTimer = setInterval(() => {
          demo.seconds++;
          const hint = $(".mic-hint");
          if (hint)
            hint.textContent =
              "00:" +
              String(demo.seconds).padStart(2, "0") +
              " · 点击下方按钮结束";
          if (demo.seconds >= 59) {
            clearInterval(demoTimer);
            demoTimer = null;
            demo.kind = null;
            render();
          }
        }, 1000);
      }
      async function copyResult() {
        try {
          await navigator.clipboard.writeText(demo.text);
          toast("已复制识别结果");
        } catch (error) {
          console.error("复制识别结果失败", error);
          toast("当前浏览器未允许复制，可长按结果文字选择。");
        }
      }
      function changeTab(tab) {
        if (state.tab === tab) return;
        stopDemo();
        state.tab = tab;
        render();
        window.scrollTo({ top: 0, behavior: "instant" });
      }
      function demoState() {
        choiceSheet(
          "测试演示状态",
          [
            {
              id: "success",
              name: "正常操作",
              desc: "试听播放状态、识别开始与结束",
              selected: state.demoOutcome === "success",
            },
            {
              id: "permission",
              name: "未授予麦克风权限",
              desc: "查看识别测试的权限提示",
              selected: state.demoOutcome === "permission",
            },
            {
              id: "unavailable",
              name: "服务不可用",
              desc: "查看当前测试区的错误状态",
              selected: state.demoOutcome === "unavailable",
            },
          ],
          (item) => {
            stopDemo();
            state.demoOutcome = item.id;
            closeSheet();
            render();
            toast("演示状态已切换");
          },
          {
            description:
              "此处仅切换设计稿的测试状态，不检查设备权限或服务连接。",
          },
        );
      }
      function handleAction(button) {
        const action = button.dataset.action;
        if (action === "theme") {
          state.theme = state.theme === "dark" ? "light" : "dark";
          render();
        } else if (action === "tab") changeTab(button.dataset.tab);
        else if (action === "profiles") profiles();
        else if (action === "profile-menu") profileMenu();
        else if (action === "new-profile") profileName("new");
        else if (action === "engine") chooseEngine();
        else if (action === "voices") chooseVoice();
        else if (action === "manual-voice") manualVoice();
        else if (action === "models") chooseModel();
        else if (action === "close-sheet") closeSheet();
        else if (action === "choice")
          sheetActions[Number(button.dataset.index)]();
        else if (action === "reset-voice") {
          config("tts").voice = "";
          updated();
          render();
        } else if (action === "reveal-key") {
          const input = $("#field-config-apiKey");
          input.type = input.type === "password" ? "text" : "password";
          button.setAttribute("aria-pressed", String(input.type === "text"));
        } else if (action === "add-cleaner") addCleaner();
        else if (action === "edit-cleaner")
          addCleaner(Number(button.dataset.index));
        else if (action === "remove-cleaner") {
          current("tts").cleaners.splice(Number(button.dataset.index), 1);
          updated();
          render();
        } else if (action === "test-tts") testTts();
        else if (action === "test-stt") testStt();
        else if (action === "copy-result") {
          copyResult();
        } else if (action === "wake-mode") {
          state.wake.mode = button.dataset.mode;
          updated();
          render();
        } else if (action === "attachment")
          attachment(Number(button.dataset.index));
        else if (action === "assistant")
          toast("原生页面将在这里打开 Android 默认助手设置");
        else if (action === "enroll") {
          state.wake.samples =
            state.wake.samples < 3 ? state.wake.samples + 1 : 0;
          updated();
          render();
          toast("已更新模板演示状态，未录制声音");
        } else if (action === "clear-samples") {
          formSheet(
            "清除唤醒模板",
            '<p class="sheet-description">清除当前三个位置中的示例模板？</p>',
            () => {
              state.wake.samples = 0;
              closeSheet();
              updated();
              render();
              return true;
            },
            { save: "清除" },
          );
        } else if (action === "demo-state") demoState();
        else if (action === "reset") {
          formSheet(
            "重置示例",
            '<p class="sheet-description">恢复初始示例配置，包括本页新建的档案与唤醒设置。</p>',
            () => {
              stopDemo();
              const theme = state.theme;
              state = initialState();
              state.theme = theme;
              foldState = {};
              closeSheet();
              render();
              $("#draft-state").textContent = "示例草稿";
              toast("已恢复初始示例");
              return true;
            },
            { save: "重置" },
          );
        }
      }
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-action]");
        if (button && !button.disabled) handleAction(button);
      });
      document.addEventListener("submit", (event) => {
        if (event.target.id === "sheet-form") {
          event.preventDefault();
          if (formAction) formAction();
        }
      });
      document.addEventListener("input", (event) => {
        const input = event.target;
        if (input.hasAttribute("data-choice-search")) {
          const term = input.value.trim().toLowerCase();
          let count = 0;
          document.querySelectorAll("#choices .choice").forEach((choice) => {
            choice.hidden = !choice.dataset.search.includes(term);
            if (!choice.hidden) count++;
          });
          $("#no-choices").hidden = count !== 0;
          return;
        }
        if (!input.dataset.field) return;
        const key = input.dataset.field,
          scope = input.dataset.scope;
        if (input.type === "checkbox" || input.tagName === "SELECT") return;
        const value =
          input.type === "range" ? Number(input.value) : input.value;
        if (scope === "profile") current()[key] = Number(value);
        else if (scope === "state") state[key] = value;
        else if (scope === "wake" && key !== "timeout" && key !== "phrase")
          state.wake[key] = value;
        else if (
          scope === "config" &&
          !["headers", "body", "pipeline", "options", "speaker"].includes(key)
        )
          config()[key] = value;
        if (input.type === "range") {
          const output = $("#output-" + key);
          output.textContent = Number(value).toFixed(2) + "×";
          input.style.setProperty("--fill", ((value - 0.5) / 1.5) * 100 + "%");
        }
        updated();
      });
      document.addEventListener("change", (event) => {
        const input = event.target;
        if (!input.dataset.field) return;
        const key = input.dataset.field,
          scope = input.dataset.scope,
          value = input.type === "checkbox" ? input.checked : input.value;
        if (scope === "wake") {
          if (key === "timeout") {
            const number = Number(value);
            const valid =
              Number.isInteger(number) && number >= 1 && number <= 600;
            $("#timeout-error").textContent = valid
              ? ""
              : "请输入 1–600 之间的整数。";
            input.setAttribute("aria-invalid", String(!valid));
            if (!valid) return;
            state.wake.timeout = number;
          } else if (key === "phrase") {
            if (!value.trim()) {
              toast("唤醒词不能为空");
              input.value = state.wake.phrase;
              return;
            }
            if (state.wake.regex) {
              try {
                validatePattern(value);
              } catch (error) {
                $("#wake-regex-error").textContent =
                  "正则表达式无效：" + error.message;
                input.setAttribute("aria-invalid", "true");
                return;
              }
            }
            state.wake.phrase = value;
            $("#wake-regex-error").textContent = "";
            input.setAttribute("aria-invalid", "false");
          } else if (key === "regex" && value) {
            try {
              validatePattern(state.wake.phrase);
            } catch (error) {
              input.checked = false;
              $("#wake-regex-error").textContent =
                "正则表达式无效：" + error.message;
              return;
            }
            state.wake.regex = true;
          } else state.wake[key] = value;
          if (input.type === "checkbox") {
            updated();
            render();
            return;
          }
        } else if (scope === "profile") {
          current()[key] = Number(value);
        } else if (scope === "config") {
          if (["headers", "pipeline", "options"].includes(key)) {
            try {
              const parsed = JSON.parse(value);
              if (key === "pipeline" && !Array.isArray(parsed))
                throw new Error("响应流水线需要使用 JSON 数组");
              if (
                ["headers", "options"].includes(key) &&
                (parsed === null ||
                  Array.isArray(parsed) ||
                  typeof parsed !== "object")
              )
                throw new Error("这里需要使用 JSON 对象");
              config()[key] = value;
              $("#json-error").textContent = "";
              input.setAttribute("aria-invalid", "false");
            } catch (error) {
              $("#json-error").textContent = "格式无效：" + error.message;
              input.setAttribute("aria-invalid", "true");
              return;
            }
          } else if (key === "speaker") {
            if (!/^\d+$/.test(value)) {
              toast("说话人 ID 需要是非负整数");
              return;
            }
            config().speaker = Number(value);
          } else config()[key] = value;
        } else if (scope === "state") state[key] = value;
        updated();
      });
      document.addEventListener(
        "toggle",
        (event) => {
          if (event.target.matches("details[data-fold]"))
            foldState[event.target.dataset.fold] = event.target.open;
        },
        true,
      );
      $(".tabs").addEventListener("keydown", (event) => {
        if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key))
          return;
        const tabs = ["tts", "stt", "wake"];
        let index = tabs.indexOf(state.tab);
        if (event.key === "Home") index = 0;
        else if (event.key === "End") index = 2;
        else index = (index + (event.key === "ArrowRight" ? 1 : 2)) % 3;
        event.preventDefault();
        changeTab(tabs[index]);
        $("#tab-" + tabs[index]).focus();
      });
      sheet.addEventListener("click", (event) => {
        if (event.target === sheet) {
          const rect = sheet.getBoundingClientRect();
          if (
            event.clientX < rect.left ||
            event.clientX > rect.right ||
            event.clientY < rect.top ||
            event.clientY > rect.bottom
          )
            closeSheet();
        }
      });
      sheet.addEventListener("cancel", () => {
        if (focusBeforeSheet && focusBeforeSheet.isConnected)
          focusBeforeSheet.focus();
      });
      render();
    </script>
  </body>
</html>

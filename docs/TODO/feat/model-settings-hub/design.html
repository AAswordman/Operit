<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f1" />
    <title>Operit · 模型与参数配置</title>
    <style>
      /* 使用少量共享色值，让连接、参数和用途保持同一套视觉语言。 */
      :root {
        --bg: #f5f5f1;
        --surface: #fff;
        --ink: #252e27;
        --muted: #7b8278;
        --line: #e5e8df;
        --accent: #526e4e;
        --soft: #edf2e8;
        --soft-ink: #46613f;
        --quiet: #f2f4ee;
        --hero: #29372c;
        --hero-ink: #f2f5ec;
        --hero-muted: #b7c6b1;
        --track: #dce4d6;
        --danger: #a14539;
        --canvas: #e7e9e2;
        --shadow: 0 25px 90px #24332218;
        color-scheme: light;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei',
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      html[data-theme='dark'] {
        --bg: #171d19;
        --surface: #222a24;
        --ink: #e5ece2;
        --muted: #a1ad9c;
        --line: #343f34;
        --accent: #b5cca7;
        --soft: #2c3b29;
        --soft-ink: #c0d7b3;
        --quiet: #2a332c;
        --hero: #33472f;
        --hero-ink: #eef5e8;
        --hero-muted: #c0d0b7;
        --track: #46563f;
        --danger: #efb2a5;
        --canvas: #111612;
        --shadow: 0 25px 90px #0004;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--ink);
        background: var(--bg);
        font-size: 15px;
        line-height: 1.5;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        border: 0;
        cursor: pointer;
        color: inherit;
        touch-action: manipulation;
      }
      button:disabled {
        cursor: default;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      button,
      input,
      select,
      textarea {
        min-width: 0;
      }
      [hidden] {
        display: none !important;
      }
      svg {
        width: 21px;
        height: 21px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .symbols {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      .stage {
        display: block;
        width: 100%;
        max-width: none;
        min-height: 0;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      .intro {
        display: none;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 21px;
        font-weight: 750;
        letter-spacing: -0.7px;
      }
      .brand svg {
        color: var(--accent);
        width: 28px;
        height: 28px;
      }
      .overline {
        margin: 67px 0 18px;
        font-size: 11px;
        letter-spacing: 2px;
        color: var(--accent);
        font-weight: 650;
      }
      .intro h1 {
        font-size: 43px;
        line-height: 1.35;
        letter-spacing: -1.5px;
        font-weight: 650;
      }
      .intro h1 span {
        color: var(--accent);
      }
      .intro > p {
        font-size: 13px;
        line-height: 1.95;
        color: var(--muted);
        margin-top: 25px;
      }
      .design-notes {
        margin-top: 33px;
        border-top: 1px solid var(--line);
      }
      .design-note {
        display: grid;
        grid-template-columns: 23px 1fr;
        gap: 12px;
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
      }
      .design-note > span {
        font-size: 10px;
        color: var(--accent);
        margin-top: 4px;
      }
      .design-note strong {
        font-size: 12px;
        font-weight: 650;
      }
      .design-note p {
        font-size: 11px;
        line-height: 1.8;
        color: var(--muted);
        margin-top: 4px;
      }
      .intro small {
        display: block;
        margin-top: 33px;
        font-size: 10px;
        color: var(--muted);
      }
      .phone {
        display: flex;
        flex-direction: column;
        position: relative;
        isolation: isolate;
        width: 100%;
        max-width: none;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        margin: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        background: var(--bg);
      }
      .scroller {
        flex: 1;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
        scroll-behavior: smooth;
      }
      .scroller::-webkit-scrollbar {
        display: none;
      }
      .appbar {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 64px;
        height: auto;
        padding: 8px 16px;
        padding-top: max(8px, env(safe-area-inset-top));
        background: var(--bg);
        flex-shrink: 0;
      }
      .back {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        min-height: 44px;
        padding: 0;
        color: var(--ink);
      }
      .back svg {
        width: 24px;
        height: 24px;
      }
      .bar-title {
        flex: 1;
        font-size: 19px;
        line-height: 1.4;
        font-weight: 650;
        margin: 0;
        letter-spacing: -0.25px;
      }
      .icon-btn {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: transparent;
        flex-shrink: 0;
      }
      .icon-btn svg {
        width: 19px;
        height: 19px;
      }
      .icon-btn:hover {
        background: var(--soft);
      }
      .content {
        padding: 8px 20px 28px;
      }
      .page-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 17px;
      }
      .page-heading h1 {
        font-size: 28px;
        letter-spacing: -1px;
        font-weight: 720;
      }
      .draft-label {
        font-size: 10px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .draft-label::before {
        content: '';
        width: 5px;
        height: 5px;
        background: var(--accent);
        border-radius: 50%;
      }
      .config-card {
        background: var(--hero);
        color: var(--hero-ink);
        border-radius: 21px;
        padding: 17px 17px 14px;
        position: relative;
        overflow: hidden;
      }
      .config-card::after {
        content: '';
        position: absolute;
        width: 145px;
        height: 145px;
        border: 1px solid #ffffff0d;
        border-radius: 50%;
        right: -53px;
        top: -57px;
        pointer-events: none;
      }
      .card-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 10px;
        color: var(--hero-muted);
        margin-bottom: 13px;
      }
      .card-meta button {
        display: flex;
        align-items: center;
        gap: 4px;
        background: #ffffff12;
        border: 1px solid #ffffff17;
        padding: 4px 8px;
        border-radius: 20px;
        color: var(--hero-ink);
        font-size: 10px;
        min-height: 28px;
      }
      .card-meta svg {
        width: 12px;
        height: 12px;
      }
      .config-choice {
        display: flex;
        align-items: center;
        text-align: left;
        gap: 12px;
        width: 100%;
        padding: 0;
        background: transparent;
        color: var(--hero-ink);
      }
      .provider-mark {
        width: 43px;
        height: 43px;
        display: grid;
        place-items: center;
        font-size: 16px;
        letter-spacing: -0.8px;
        font-weight: 650;
        border-radius: 13px;
        background: #ffffff12;
        border: 1px solid #ffffff17;
        flex-shrink: 0;
      }
      .config-choice h2 {
        font-size: 20px;
        letter-spacing: -0.5px;
        font-weight: 650;
      }
      .config-choice p {
        font-size: 11px;
        color: var(--hero-muted);
        margin-top: 3px;
      }
      .config-choice > svg {
        margin-left: auto;
        width: 17px;
        height: 17px;
        color: var(--hero-muted);
      }
      .card-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 15px;
        padding-top: 11px;
        border-top: 1px solid #ffffff1a;
        font-size: 10px;
        color: var(--hero-muted);
        gap: 10px;
      }
      .card-bottom button {
        color: var(--hero-muted);
        background: transparent;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 1px 0;
        text-align: right;
        font-size: 10px;
        min-height: 27px;
      }
      .card-bottom button svg {
        width: 12px;
        height: 12px;
      }
      .config-strip {
        display: flex;
        gap: 7px;
        padding: 13px 0 0;
        overflow: auto;
        scrollbar-width: none;
      }
      .config-chip {
        white-space: nowrap;
        flex-shrink: 0;
        border-radius: 10px;
        border: 1px solid var(--line);
        padding: 7px 10px;
        font-size: 10px;
        min-height: 34px;
        background: transparent;
        color: var(--muted);
      }
      .config-chip[aria-pressed='true'] {
        background: var(--surface);
        color: var(--ink);
        border-color: var(--ink);
        font-weight: 600;
      }
      .chip-add {
        width: 34px;
        min-width: 34px;
        padding: 0;
        display: grid;
        place-items: center;
      }
      .chip-add svg {
        width: 15px;
        height: 15px;
      }
      .tabs {
        display: flex;
        position: sticky;
        top: 0;
        z-index: 3;
        gap: 0;
        justify-content: space-around;
        margin: 12px 0 20px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }
      .tab {
        flex: 1;
        position: relative;
        background: transparent;
        padding: 12px 0 13px;
        min-height: 48px;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
        white-space: nowrap;
      }
      .tab[aria-selected='true'] {
        color: var(--ink);
        font-weight: 650;
      }
      .tab[aria-selected='true']::after {
        content: '';
        position: absolute;
        left: calc(50% - 19px);
        right: calc(50% - 19px);
        bottom: -1px;
        height: 2px;
        background: var(--accent);
        border-radius: 2px;
      }
      .tab small {
        font-size: 10px;
        margin-left: 5px;
        color: var(--muted);
        font-weight: 400;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-width: 0;
        margin-bottom: 13px;
      }
      .section-head h2 {
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.25px;
      }
      .section-head p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 5px;
        line-height: 1.65;
      }
      .step {
        font-size: 10px;
        color: var(--muted);
        padding-top: 4px;
        font-variant-numeric: tabular-nums;
      }
      .form-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 17px;
        overflow: hidden;
      }
      .field {
        padding: 16px;
      }
      .field + .field {
        border-top: 1px solid var(--line);
      }
      .field-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 21px;
        margin-bottom: 10px;
      }
      .field-label label,
      .field-label > span {
        font-size: 13px;
        font-weight: 600;
      }
      .subtle-label {
        font-size: 9px !important;
        letter-spacing: 0.4px;
        color: var(--muted);
        font-weight: 400 !important;
      }
      .provider-select {
        border: 0;
        outline: 0;
        width: 100%;
        color: var(--ink);
        background: transparent;
        font-size: 14px;
        padding: 0 0 3px;
        min-height: 31px;
      }
      .text-input {
        width: 100%;
        min-height: 46px;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--bg);
        color: var(--ink);
        font-size: 14px;
        outline: 0;
      }
      .text-input:focus {
        border-color: var(--accent);
      }
      .text-input.invalid {
        border-color: var(--danger);
      }
      input[type='password'] {
        letter-spacing: 2px;
      }
      .input-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .input-row .text-input {
        flex: 1;
      }
      .mini-action {
        min-height: 34px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--soft);
        color: var(--accent);
        font-size: 11px;
        white-space: nowrap;
      }
      .input-note {
        font-size: 11px;
        line-height: 1.75;
        color: var(--muted);
        margin-top: 8px;
        overflow-wrap: anywhere;
      }
      .input-error {
        color: var(--danger);
      }
      .key-count {
        font-size: 10px;
        color: var(--accent);
        background: var(--soft);
        padding: 3px 7px;
        border-radius: 5px;
        white-space: nowrap;
      }
      .key-button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-height: 48px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--quiet);
        text-align: left;
        font-size: 14px;
      }
      .key-button-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .key-button svg {
        width: 17px;
        height: 17px;
        color: var(--muted);
      }
      .key-dot {
        display: inline-block;
        width: 5px;
        height: 5px;
        background: var(--accent);
        border-radius: 50%;
        margin-right: 3px;
      }
      .model-pick {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        text-align: left;
        padding: 13px 12px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--bg);
        gap: 10px;
      }
      .model-pick strong {
        font-size: 13px;
        font-weight: 600;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        overflow-wrap: anywhere;
      }
      .model-pick small {
        display: block;
        font-size: 10px;
        color: var(--muted);
        margin-top: 4px;
      }
      .model-pick svg {
        width: 15px;
        height: 15px;
        color: var(--muted);
      }
      .capabilities {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .capability {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 6px;
        font-size: 9px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .capability svg {
        width: 11px;
        height: 11px;
      }
      .section-gap {
        margin-top: 25px;
      }
      .toggles {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        padding: 0 16px;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 0;
      }
      .toggle-row + .toggle-row {
        border-top: 1px solid var(--line);
      }
      .toggle-row > div {
        flex: 1;
        min-width: 0;
      }
      .toggle-row strong {
        display: block;
        font-size: 12px;
        font-weight: 600;
      }
      .toggle-row p {
        font-size: 10px;
        color: var(--muted);
        margin-top: 3px;
        line-height: 1.65;
      }
      .switch {
        position: relative;
        flex-shrink: 0;
        width: 40px;
        height: 24px;
        padding: 0;
        border-radius: 20px;
        background: var(--line);
      }
      .switch::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--surface);
        box-shadow: 0 1px 3px #0002;
        transition: transform 0.15s;
      }
      .switch[aria-checked='true'] {
        background: var(--accent);
      }
      .switch[aria-checked='true']::after {
        transform: translateX(16px);
        background: var(--bg);
      }
      .switch::before {
        content: '';
        position: absolute;
        inset: -10px -4px;
      }
      .fold {
        margin-top: 12px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: var(--surface);
        overflow: hidden;
      }
      .fold summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 54px;
        padding: 15px 16px;
        list-style: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
      }
      .fold summary::-webkit-details-marker {
        display: none;
      }
      .fold summary small {
        font-size: 10px;
        color: var(--muted);
        font-weight: 400;
        margin-left: auto;
      }
      .fold summary svg {
        width: 14px;
        height: 14px;
        color: var(--muted);
        transition: transform 0.15s;
      }
      .fold[open] summary > svg {
        transform: rotate(90deg);
      }
      .fold-body {
        border-top: 1px solid var(--line);
        padding: 15px 14px;
      }
      .fold-body .field {
        padding: 0;
        margin: 0 0 13px;
        border: 0;
      }
      .fold-body .field:last-child {
        margin: 0;
      }
      .micro-note {
        font-size: 10px;
        color: var(--muted);
        line-height: 1.8;
      }
      .number-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .parameter {
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        margin-bottom: 11px;
      }
      .parameter-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .parameter-title strong {
        display: block;
        font-size: 12px;
        font-weight: 600;
      }
      .parameter-title small {
        font-size: 9px;
        letter-spacing: 0.4px;
        color: var(--muted);
        display: block;
        margin-top: 3px;
        font-family: ui-monospace, monospace;
      }
      .send-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        color: var(--muted);
      }
      .send-toggle input {
        accent-color: var(--accent);
        width: 14px;
        height: 14px;
        margin: 0;
        cursor: pointer;
      }
      .slider-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 18px 0 4px;
        gap: 12px;
      }
      .slider-top span {
        font-size: 10px;
        color: var(--muted);
      }
      .number-box {
        width: 72px;
        font-size: 15px;
        font-weight: 600;
        text-align: right;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        border-radius: 8px;
        padding: 5px 7px;
        appearance: textfield;
        font-variant-numeric: tabular-nums;
      }
      .number-box::-webkit-inner-spin-button {
        appearance: none;
      }
      .range {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        height: 4px;
        border-radius: 4px;
        background: linear-gradient(
          to right,
          var(--accent) 0 var(--fill),
          var(--track) var(--fill) 100%
        );
        cursor: pointer;
        display: block;
        margin: 19px 0 14px;
        touch-action: pan-y;
      }
      .range::-webkit-slider-thumb {
        appearance: none;
        width: 17px;
        height: 17px;
        background: var(--surface);
        border: 4px solid var(--accent);
        border-radius: 50%;
        box-shadow: 0 0 0 4px var(--surface);
      }
      .range::-moz-range-thumb {
        width: 10px;
        height: 10px;
        background: var(--surface);
        border: 4px solid var(--accent);
        border-radius: 50%;
      }
      .range:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .parameter:has(.send-toggle input:not(:checked)) .slider-top {
        opacity: 0.45;
      }
      .range-labels {
        display: flex;
        justify-content: space-between;
        color: var(--muted);

    <script>
      'use strict';
      // 所有配置均为明确标注的示例，交互只修改内存，不读取真实密钥、不发起请求。
      const providers = {
        deepseek: {
          name: 'DeepSeek',
          mark: 'DS',
          format: 'OpenAI 兼容接口',
          endpoint: 'https://api.deepseek.com/v1',
          models: ['deepseek-chat', 'deepseek-reasoner'],
          capabilities: ['文本', '工具调用'],
        },
        gemini: {
          name: 'Gemini',
          mark: 'G',
          format: 'Gemini 原生接口',
          endpoint: 'https://generativelanguage.googleapis.com/v1beta',
          models: ['gemini-2.5-flash', 'gemini-2.5-pro'],
          capabilities: ['文本', '图像', '音频', '视频'],
        },
        openai: {
          name: 'OpenAI 兼容',
          mark: 'O',
          format: 'OpenAI 兼容接口',
          endpoint: 'https://example.com/v1',
          models: ['gpt-4.1-mini', 'gpt-4.1', 'text-embedding-3-small'],
          capabilities: ['文本', '工具调用'],
        },
      };
      const baseParameters = () => ({
        temperature: { value: 0.7, send: true },
        max_tokens: { value: 8192, send: true },
        top_p: { value: 1, send: false },
        frequency_penalty: { value: 0, send: false },
        presence_penalty: { value: 0, send: false },
      });
      function makeConfig(id, name, group, provider, model) {
        return {
          id,
          name,
          group,
          provider,
          model,
          endpoint: providers[provider].endpoint,
          keys: [
            { id: id + '-key-1', name: '主密钥', value: 'demo-only-not-a-real-key', enabled: true },
            {
              id: id + '-key-2',
              name: '备用密钥',
              value: 'demo-only-second-example',
              enabled: false,
            },
          ],
          pool: false,
          strategy: '轮询',
          params: baseParameters(),
          preset: 'balanced',
          thinking: 'provider',
          tools: true,
          stream: true,
          directImage: provider === 'gemini',
          headers: [{ name: 'Accept-Language', value: 'zh-CN' }],
          custom: '{}',
          contextSummary: defaultContextSummary(),
        };
      }
      const summaryHistory = { imageTurns: 3, mediaTurns: 1 };
      const configs = [
        makeConfig('daily', '日常对话', '常用', 'deepseek', 'deepseek-chat'),
        makeConfig('reason', '深度思考', '常用', 'deepseek', 'deepseek-reasoner'),
        makeConfig('vision', '多模态', '常用', 'gemini', 'gemini-2.5-flash'),
        makeConfig('embedding', '记忆检索', '专项', 'openai', 'text-embedding-3-small'),
      ];
      const functions = [
        { id: 'CHAT', title: '常规对话', icon: 'chat', config: 'daily' },
        { id: 'SUMMARY', title: '对话总结', icon: 'log', config: 'daily' },
        { id: 'TITLE_GENERATION', title: '标题生成', icon: 'edit', config: 'daily' },
        { id: 'MEMORY', title: '记忆更新', icon: 'memory', config: 'daily' },
        { id: 'MEMORY_EMBEDDING', title: '记忆向量', icon: 'storage', config: 'embedding' },
        { id: 'UI_CONTROLLER', title: '界面自动化', icon: 'layout', config: 'vision' },
        { id: 'TRANSLATION', title: '翻译', icon: 'translate', config: 'daily' },
        { id: 'GREP', title: '代码检索规划', icon: 'search', config: 'reason' },
        { id: 'ROLE_RESPONSE_PLANNER', title: '群组发言规划', icon: 'person', config: 'reason' },
        { id: 'IMAGE_RECOGNITION', title: '图像识别', icon: 'image', config: 'vision' },
        { id: 'AUDIO_RECOGNITION', title: '音频识别', icon: 'voice', config: 'vision' },
        { id: 'VIDEO_RECOGNITION', title: '视频识别', icon: 'video', config: 'vision' },
      ].map((fn) => ({
        ...fn,
        model: configs.find((c) => c.id === fn.config).model,
        temperature: '',
        maxTokens: '',
      }));
      const root = document.documentElement,
        scroller = document.getElementById('scroller'),
        overlay = document.getElementById('overlay'),
        sheet = document.getElementById('sheet'),
        sheetContent = document.getElementById('sheetContent');
      let currentId = 'daily',
        assignmentQuery = '',
        assignmentSearchOpen = false,
        currentTab = 'connection',
        scope = 'all',
        lastFocus = null,
        sheetState = null,
        toastTimer = null,
        nextId = 1;
      const current = () => configs.find((config) => config.id === currentId);
      const icon = (name) => /* HTML */ `
        <svg aria-hidden="true"><use href="#i-${name}" /></svg>
      `;
      const esc = (value) =>
        String(value).replace(/[&<>"']/g, (char) => '&#' + char.charCodeAt(0) + ';');
      const normalize = (value) => String(value).normalize('NFKC').toLowerCase().trim();
      const activeKeys = (config) => config.keys.filter((key) => key.enabled).length;
      function notify(message) {
        const toast = document.getElementById('toast');
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.hidden = false;
        toastTimer = setTimeout(() => {
          toast.hidden = true;
        }, 2000);
      }
      function changed(message) {
        document.getElementById('saveStatus').innerHTML = icon('check') + '预览已更新';
        if (message) notify(message);
      }
      function syncTheme() {
        const dark = root.dataset.theme === 'dark';
        document.getElementById('themeButton').setAttribute('aria-pressed', String(dark));
        document
          .getElementById('themeButton')
          .setAttribute('aria-label', dark ? '切换到浅色外观' : '切换到深色外观');
        document.getElementById('themeIcon').setAttribute('href', dark ? '#i-sun' : '#i-moon');
        document.querySelector('meta[name="theme-color"]').content = getComputedStyle(root)
          .getPropertyValue('--bg')
          .trim();
      }
      function toggleRow(title, description, property, value) {
        return /* HTML */ `
          <div class="toggle-row">
            <div>
              <strong>${title}</strong>
              <p>${description}</p>
            </div>

      function buildRequestBase() {
        const config = current(),
          parameters = {};
        try {
          const endpoint = new URL(config.endpoint);
          if (!['http:', 'https:'].includes(endpoint.protocol)) throw Error('地址协议错误');
        } catch {
          return { preview: true, error: '请先填写有效的 API 地址。' };
        }
        for (const [key, parameter] of Object.entries(config.params))
          if (parameter.send) parameters[key] = parameter.value;
        let extra;
        try {
          extra = JSON.parse(config.custom);
          if (!extra || typeof extra !== 'object' || Array.isArray(extra))
            throw Error('需要 JSON 对象');
        } catch (error) {
          return { preview: true, error: '请先修正自定义参数：' + error.message };
        }
        return {
          preview: true,
          provider: providers[config.provider].name,
          endpoint: config.endpoint,
          credentials: config.pool
            ? {
                type: 'key_pool',
                enabled: activeKeys(config),
                strategy: config.strategy,
                key: '[已脱敏]',
              }
            : { type: 'single_key', key: '[已脱敏]' },
          headers: Object.fromEntries(
            config.headers
              .filter((header) => header.name.trim())

                /authorization|api[-_]?key|token|secret|cookie/i.test(header.name)

                  : header.value,
              ]),
          ),
          model: config.model,
          stream: config.stream,
          toolCalls: config.tools,
          thinking: config.thinking,
          parameters: { ...parameters, ...extra },
        };

        current().endpoint = input.value.trim();
        try {
          const url = new URL(input.value);
          if (!['http:', 'https:'].includes(url.protocol)) throw Error('协议错误');
          input.classList.remove('invalid');
          note.classList.remove('input-error');
          note.textContent = '地址格式有效；本设计稿不会发起连接。';
          current().endpoint = input.value.trim();
          changed();

        } catch {
          input.classList.add('invalid');

          note.textContent = '请输入以 https:// 或 http:// 开头的完整地址。';
          return false;

      function syncParameter(key, value) {
        const meta = parameterMeta[key],
          numeric = Number(value);
        if (
          String(value).trim() === '' ||
          !Number.isFinite(numeric) ||
          numeric < meta.min ||
          numeric > meta.max
        )
          return false;
        current().params[key].value = numeric;
        current().preset = 'custom';
        document
          .querySelectorAll('[data-preset]')
          .forEach((button) => button.setAttribute('aria-pressed', 'false'));
        const slider = document.querySelector('[data-range="' + key + '"]'),
          number = document.querySelector('[data-number="' + key + '"]');
        slider.value = numeric;
        slider.style.setProperty(
          '--fill',
          ((numeric - meta.min) / (meta.max - meta.min)) * 100 + '%',
        );
        number.value = numeric;
        changed();
        return true;

          if (targetId && targetId !== id) {

      function preserveParameterFolds() {
        return Array.from(document.querySelectorAll('#parametersContent details[open]')).map(
          (element) => element.id,

      function restoreParameterFolds(ids) {
        for (const id of ids) {

      function handleV2Click(event, button) {
        if (handleWorkbenchClick(event, button)) return true;
        const data = button.dataset,
          config = current();
        if (data.ruleEdit !== undefined) {
          const index = Number(data.ruleEdit);
          openSheet({
            kind: 'thought-editor',
            index,
            draft: JSON.parse(JSON.stringify(config.thinkingRules[index])),
          });
          return true;
        }
        if (data.ruleMove !== undefined) {
          const index = Number(data.ruleMove);
          moveListItem(config.thinkingRules, index, index + Number(data.direction));
          refreshThoughtRows();
          changed();
          return true;
        }
        if (data.ruleAddAction) {
          sheetState.draft[data.ruleAddAction].push({ path: '', value: '' });
          rerenderRuleEditor();
          return true;
        }
        if (data.ruleRemoveAction) {
          sheetState.draft[data.ruleRemoveAction].splice(Number(data.index), 1);
          rerenderRuleEditor();
          return true;
        }
        if (data.levelMove !== undefined) {
          moveListItem(
            sheetState.draft.options,
            Number(data.levelMove),
            Number(data.levelMove) + Number(data.direction),
          );
          rerenderRuleEditor();
          return true;
        }
        if (data.levelRemove !== undefined) {
          sheetState.draft.options.splice(Number(data.levelRemove), 1);
          rerenderRuleEditor();
          return true;
        }
        if (data.pendingGroup) {
          sheetState.pendingGroup = data.pendingGroup;
          renderGroups();
          return true;
        }
        if (data.collapseGroup) {
          const group = data.collapseGroup,
            index = sheetState.collapsed.indexOf(group);
          if (index < 0) sheetState.collapsed.push(group);
          else sheetState.collapsed.splice(index, 1);
          renderGroups();
          return true;
        }
        if (data.treeConfig) {
          selectedGroup = configs.find((item) => item.id === data.treeConfig).group;
          selectConfig(data.treeConfig);
          closeSheet();
          return true;
        }
        if (data.renameGroup) {
          openSheet({ kind: 'group-name', oldName: data.renameGroup });
          return true;
        }
        if (data.deleteGroup) {
          openSheet({ kind: 'delete-group', group: data.deleteGroup });
          return true;
        }
        if (data.addProfileGroup) {
          openSheet({ kind: 'new', newGroup: data.addProfileGroup });
          return true;
        }
        if (data.providerChoice) {
          const provider = providers[data.providerChoice];
          config.provider = data.providerChoice;
          config.endpoint = provider.endpoint;
          config.model = provider.models[0];
          render();
          closeSheet();
          changed('示例服务方式已更新');
          return true;
        }
        if (data.modelState) {
          sheetState.modelState = data.modelState;
          renderModelList();
          return true;
        }
        if (data.keyMenu) {
          sheetState.keyMenu = sheetState.keyMenu === data.keyMenu ? null : data.keyMenu;
          renderKeys();
          return true;
        }
        if (data.selectionPreset) {
          sheetState.preset = data.selectionPreset;
          sheetState.selectedIds = config.keys
            .filter(
              (key) => data.selectionPreset === 'all' || keyStatus(key) === data.selectionPreset,
            )
            .map((key) => key.id);
          renderPoolSelection();
          return true;
        }
        if (data.preset) {
          const ids = preserveParameterFolds();
          config.params.temperature = {
            value: { precise: 0.2, balanced: 0.7, creative: 1.2 }[data.preset],
            send: true,
          };
          config.preset = data.preset;
          renderParameters();
          restoreParameterFolds(ids);
          changed();
          return true;
        }
        if (data.chooseProfile) {
          selectedGroup = configs.find((item) => item.id === data.chooseProfile).group;

      // 从手柄开始的指针拖动可用于触屏；每次松手后再更新列表，避免中途丢失捕获。
      document.addEventListener('pointerdown', (event) => {
        const handle = event.target.closest('[data-drag-kind]');
        if (!handle || event.button !== 0) return;
        poolDrag = {
          kind: handle.dataset.dragKind,
          id: handle.dataset.dragId,
          targetId: null,
          targetGroup: null,
          startX: event.clientX,
          startY: event.clientY,
          moved: false,
          handle,
        };
        handle.setPointerCapture(event.pointerId);
      });
      document.addEventListener('pointermove', (event) => {
        if (!poolDrag) return;
        if (
          Math.hypot(event.clientX - poolDrag.startX, event.clientY - poolDrag.startY) < 6 &&
          !poolDrag.moved
        )
          return;
        poolDrag.moved = true;
        event.preventDefault();
        document
          .querySelectorAll('.drag-target')
          .forEach((element) => element.classList.remove('drag-target'));
        const hit = document.elementFromPoint(event.clientX, event.clientY);
        let row = hit?.closest('[data-drag-row="' + poolDrag.kind + '"]');
        if (poolDrag.kind === 'config' && !row) {
          const group = hit?.closest('[data-drag-row="group"]');
          if (group) {
            poolDrag.targetId = null;
            poolDrag.targetGroup = group.dataset.rowId;
            group.classList.add('drag-target');
            return;
          }
        }
        if (row) {
          poolDrag.targetId = row.dataset.rowId;
          poolDrag.targetGroup = row.dataset.rowGroup || null;
          row.classList.add('drag-target');
        }
      });

        if (!poolDrag) return;

          finishDrag(drag.kind, drag.id, drag.targetId, drag.targetGroup);

          <div class="summary-scope">${icon('connect')}<span>正在编辑：<strong>${esc(config.name)}</strong> · 随配置保存</span></div>
          <div class="summary-heading"><h3>上下文设置</h3></div><div class="summary-card">${summaryNumber('contextLength', '上下文长度', '日常保留的对话长度', policy.contextLength, 'K')}${summaryNumber('maxContextLength', '最大上下文长度', '模型 API 支持的最大上下文', policy.maxContextLength, 'K')}</div>
          <div class="summary-heading"><h3>自动总结</h3></div><div class="summary-card">${summaryToggle('启用对话总结', '达到触发条件时压缩对话，保留重要信息', 'enabled', policy.enabled)}${summaryNumber('threshold', '上下文使用比例', '达到这一比例时触发总结', policy.threshold, '%', { min: 10, max: 95, step: 1, disabled: !policy.enabled })}${summaryToggle('按消息条数触发', '新消息达到指定条数时也可触发', 'byCount', policy.byCount, !policy.enabled)}${summaryNumber('messageCount', '消息条数阈值', '触发总结的新消息数量', policy.messageCount, '条', { min: 1, max: 20, step: 1, disabled: !policy.enabled || !policy.byCount })}<button class="summary-link" type="button" data-function="SUMMARY">${icon('log')}<div><strong>总结使用的模型</strong><p>${esc(summaryConfig.name)} · ${esc(summary.model)}</p></div>${icon('arrow')}</button></div>
          <div class="summary-folds"><details class="fold" id="summaryRules" data-cs-fold><summary><span>自定义总结规则<small>总结时附加的要求，留空不添加</small></span>${icon('chevron')}</summary><div class="fold-body"><label class="sr-only" for="summaryRulesInput">自定义总结规则</label><textarea id="summaryRulesInput" class="text-input" data-cs-text="rules" placeholder="希望总结时遵守的要求" ${!policy.enabled ? 'disabled' : ''}>${esc(policy.rules)}</textarea><div class="summary-editor-button"><button class="text-button" type="button" data-wb="summary-editor" ${!policy.enabled ? 'disabled' : ''}>展开编辑 ${icon('arrow')}</button></div></div></details></div>
          <div class="summary-card">${summaryToggle('总结上一轮摘要', '在新摘要中压缩上一轮摘要，会增加额外额度消耗', 'previousReview', policy.previousReview, !policy.enabled)}</div>
          <div class="summary-heading"><h3>总结结构</h3><span class="summary-tag">${policy.sections.filter(section => section.enabled).length} 个板块启用</span></div><div class="summary-folds">${policy.sections.map((section, index) => summarySection(section, index, policy)).join('')}<details class="fold" id="summaryDialogue" data-cs-fold><summary><span>对话回顾<small>在摘要末尾附带用户、助手与工具调用记录</small></span><button class="switch" type="button" role="switch" aria-label="启用对话回顾" aria-checked="${policy.dialogueReview}" data-wb="summary-toggle" data-key="dialogueReview" ${!policy.enabled ? 'disabled' : ''}></button>${icon('chevron')}</summary><div class="fold-body"><div class="field"><div class="field-label"><label for="summaryReviewTitle">回顾标题</label></div><input id="summaryReviewTitle" class="text-input" data-cs-text="reviewTitle" value="${esc(policy.reviewTitle)}" ${!policy.enabled || !policy.dialogueReview ? 'disabled' : ''}></div></div></details></div>
          <div class="summary-heading"><h3>历史媒体保留</h3><span class="summary-tag">全局设置</span></div><div class="summary-card">${summaryNumber('imageTurns', '历史图片', '向模型发送最近指定回合中的图片', summaryHistory.imageTurns, '回合', { min: 0, step: 1, global: true })}${summaryNumber('mediaTurns', '历史音视频', '向模型发送最近指定回合中的音频和视频', summaryHistory.mediaTurns, '回合', { min: 0, step: 1, global: true })}</div><p class="input-note">历史媒体回合数对所有配置生效，切换上方配置时保留。</p><p class="error-note" id="summaryError" role="alert" hidden></p>`;
        for (const id of expanded) document.getElementById(id).open = true;
      }
      function renderSummaryEditor() {
        const state = sheetState;
        const title = state.sectionIndex === undefined ? '自定义总结规则' : '板块说明';
        sheetContent.innerHTML = sheetHeading(title, '编辑「' + esc(configs.find(config => config.id === state.configId).name) + '」的总结内容。', '上下文与总结') + `<label class="sr-only" for="summaryLongText">${title}</label><textarea class="text-input summary-long-editor" id="summaryLongText">${esc(state.draft)}</textarea><div class="sheet-actions"><button class="secondary" type="button" data-action="close">取消</button><button class="primary" type="button" data-wb="save-summary-editor">保存</button></div>`;
      }
      function handleWorkbenchClick(event, button) {
        const action = button.dataset.wb;
        if (action === 'assignment-search') {
          assignmentSearchOpen = !assignmentSearchOpen;
          if (!assignmentSearchOpen) assignmentQuery = '';
          renderAssignments();
          if (assignmentSearchOpen) document.getElementById('assignmentSearch').focus({ preventScroll: true });
          return true;
        }
        if (action === 'summary-toggle' || action === 'section-toggle') {
          event.preventDefault();
          const policy = current().contextSummary;
          if (action === 'section-toggle') { const section = policy.sections[Number(button.dataset.index)]; section.enabled = !section.enabled; }
          else { const key = button.dataset.key; policy[key] = !policy[key]; }
          renderContextSummary(); changed(); return true;
        }
        if (action === 'summary-editor') {
          const index = button.dataset.index === undefined ? undefined : Number(button.dataset.index);
          const policy = current().contextSummary;
          openSheet({ kind: 'summary-editor', configId: currentId, sectionIndex: index, draft: index === undefined ? policy.rules : policy.sections[index].instruction });
          return true;
        }
        if (action === 'save-summary-editor') {
          const policy = configs.find(config => config.id === sheetState.configId).contextSummary;
          const value = document.getElementById('summaryLongText').value;
          if (sheetState.sectionIndex === undefined) policy.rules = value;
          else policy.sections[sheetState.sectionIndex].instruction = value;
          closeSheet(); renderContextSummary(); changed('总结内容的预览已更新'); return true;
        }
        return false;
      }
      function handleWorkbenchInput(event) {
        const input = event.target;
        if (input.id === 'assignmentSearch') { assignmentQuery = input.value; renderAssignments(); return true; }
        if (input.dataset.csText !== undefined) { current().contextSummary[input.dataset.csText] = input.value; changed(); return true; }
        if (input.dataset.csSection !== undefined) {
          const index = Number(input.dataset.csSection), section = current().contextSummary.sections[index];
          section[input.dataset.csProperty] = input.value;
          if (input.dataset.csProperty === 'title') document.getElementById('summarySectionTitle' + index).textContent = input.value;
          changed(); return true;
        }
        if (input.dataset.csNumber !== undefined) {
          const key = input.dataset.csNumber, value = Number(input.value), policy = current().contextSummary;
          const global = input.hasAttribute('data-cs-global');
          if (input.value.trim() === '' || !Number.isFinite(value) || !input.checkValidity()) { showError('summaryError', '请填写显示范围内的有效数值。'); return true; }
          if (!global && ((key === 'contextLength' && value > policy.maxContextLength) || (key === 'maxContextLength' && value < policy.contextLength))) { showError('summaryError', '上下文长度不能超过最大上下文长度。'); return true; }
          if (global) summaryHistory[key] = value; else policy[key] = value;
          input.removeAttribute('aria-invalid'); document.getElementById('summaryError').hidden = true; changed(); return true;
        }
        return false;
      }
      function handleWorkbenchChange(event) {
        const input = event.target;
        if (input.hasAttribute('data-wb-binding-config')) {
          sheetState.temperature = document.getElementById('bindingTemperature').value;
          sheetState.maxTokens = document.getElementById('bindingTokens').value;
          sheetState.selectedId = input.value;
          const names = configModels(configs.find(config => config.id === input.value));
          sheetState.model = names.length ? names[0] : '';
          renderSheet(); return true;
        }
        if (input.dataset.csNumber !== undefined) return handleWorkbenchInput(event);
        return false;
      }

      render();
      syncTheme();
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Operit · 离线资源设计稿</title>
<style>
/* 单文件、离线可打开；主题颜色对应当前 Android 页面。 */
:root{--bg:#101518;--panel:#181e23;--panel-2:#202930;--hover:#28343b;--text:#edf3f6;--muted:#a1b0b9;--faint:#788b97;--line:#2c363e;--primary:#96d8ed;--on-primary:#073545;--tonal:#203d49;--tonal-text:#b5e5f4;--green:#97d6bc;--green-bg:#213a32;--amber:#e9c68a;--amber-bg:#3a3224;--red:#f4aba8;--red-bg:#3b292c;--shadow:0 16px 64px #0007;--radius:20px;color-scheme:dark}
:root[data-theme="light"]{--bg:#f5f8fa;--panel:#fff;--panel-2:#edf2f5;--hover:#e3edf1;--text:#17282f;--muted:#576b77;--faint:#758791;--line:#dce5e9;--primary:#08728b;--on-primary:#fff;--tonal:#e0f0f6;--tonal-text:#155970;--green:#257355;--green-bg:#e8f5ed;--amber:#885d19;--amber-bg:#fff3dd;--red:#ad4448;--red-bg:#fcebec;--shadow:0 16px 64px #143b4d24;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
button,a,input,select{touch-action:manipulation}
button{cursor:pointer}
button{color:inherit}
button:disabled{cursor:default;opacity:.48}
button,a,input,select{outline-offset:4px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary)}
button{border:0}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4,p{margin:0}
svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon{display:inline-block;vertical-align:middle}
button svg{pointer-events:none}
[hidden]{display:none!important}
.nowrap{white-space:nowrap}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}
.app{max-width:1040px;margin:auto;padding:0 28px 42px}
.preview-bar{max-width:1040px;padding:15px 28px 0;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--faint);font-size:11px;letter-spacing:.04em}
.preview-bar strong{color:var(--muted);font-weight:500}
.preview-mark{display:inline-flex;align-items:center;gap:7px}
.preview-dot{width:6px;height:6px;border-radius:50%;background:var(--primary)}
.preview-hint{letter-spacing:0;font-size:11px}
.appbar{display:flex;align-items:center;gap:12px;min-height:80px}
.appbar h1{font-size:21px;font-weight:650;letter-spacing:.02em;flex:1}
.icon-button{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border-radius:50%;flex:none;color:var(--muted)}
.icon-button:hover{background:var(--hover);color:var(--text)}
.back{margin-left:-12px;color:var(--text)}
.app-actions{display:flex;gap:2px}
.hero{border:1px solid var(--line);border-radius:24px;padding:24px;background:var(--panel)}
.hero-top{display:flex;gap:16px;align-items:flex-start}
.hero-icon{width:52px;height:52px;border-radius:17px;background:var(--tonal);color:var(--primary);display:grid;place-items:center;flex:none}
.hero-icon svg{width:26px;height:26px}
.hero-copy{flex:1;min-width:0}
.eyebrow{font-size:11px;color:var(--primary);letter-spacing:.12em;margin-bottom:5px}
.hero h2{font-size:24px;line-height:1.4;font-weight:650;letter-spacing:.02em}
.hero-copy p{margin-top:8px;font-size:13px;color:var(--muted);max-width:540px}
.hero .icon-button{margin:-8px -9px 0 0}
.hero-bottom{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.platform{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.platform svg{width:15px;height:15px}
.platform span+span:before{content:"·";padding-right:7px;color:var(--faint)}
.prepared-link{background:transparent;color:var(--primary);padding:2px 0;min-height:32px;font-size:12px;display:flex;align-items:center;gap:6px}
.prepared-link svg{width:15px;height:15px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel-2);border-radius:16px;padding:5px;margin:24px 0 22px;gap:5px}
.tab{height:48px;border-radius:12px;background:transparent;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,color .15s}
.tab.active{background:var(--panel);color:var(--primary);box-shadow:0 1px 4px #0001;font-weight:600}
.tab svg{width:18px;height:18px}
.count{font-size:11px;line-height:20px;min-width:20px;padding:0 5px;background:var(--panel-2);border-radius:6px;display:inline-block;text-align:center;color:var(--muted);font-weight:500}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:15px}
.search{display:flex;gap:9px;align-items:center;min-width:0;flex:1;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--panel);height:46px}
.search svg{width:18px;height:18px;color:var(--faint)}
.search input{min-width:0;width:100%;height:100%;border:0;outline:none;background:transparent;color:var(--text);font-size:13px}
.search input::placeholder{color:var(--faint)}
.btn{min-height:42px;padding:9px 17px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:22px;font-size:13px;font-weight:550;background:var(--primary);color:var(--on-primary);white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn:hover{filter:brightness(1.07)}
.btn.tonal{background:var(--tonal);color:var(--tonal-text)}
.btn.outline{background:transparent;color:var(--primary);border:1px solid var(--line)}
.btn.quiet{background:transparent;color:var(--primary);padding-left:12px;padding-right:12px}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.full{width:100%}
.source-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px;color:var(--muted);font-size:12px}
.source-picker{display:flex;align-items:center;gap:7px;padding:8px 10px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;min-height:38px}
.source-picker svg{width:15px;height:15px;color:var(--primary)}
.source-picker .chevron{color:var(--faint);width:13px;height:13px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:1px 0 9px;margin:0 0 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{display:flex;align-items:center;gap:5px;flex:none;padding:6px 12px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:20px;min-height:35px;font-size:12px}
.filter.selected{background:var(--tonal);border-color:transparent;color:var(--tonal-text)}
.filter em{font-style:normal;opacity:.72;font-size:11px}
.section{margin-top:24px}
.section:first-child{margin-top:0}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:28px}
.section-head svg{width:18px;height:18px;color:var(--primary)}
.section-head h2{font-size:14px;font-weight:600}
.section-head .head-action{margin-left:auto;background:transparent;color:var(--primary);font-size:12px;min-height:36px}
.head-caption{margin:-6px 0 13px;color:var(--faint);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.resource-card{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:18px;min-width:0}
.card-head{display:flex;gap:12px;align-items:flex-start}
.resource-icon{width:43px;height:43px;border-radius:14px;background:var(--tonal);color:var(--primary);display:grid;place-items:center;flex:none}
.resource-icon svg{width:22px;height:22px}
.card-heading{flex:1;min-width:0;padding-top:1px}
.card-heading h3{font-size:14px;line-height:1.5;font-weight:600;overflow-wrap:anywhere}
.card-heading p{font-size:12px;line-height:1.6;color:var(--muted);margin-top:4px}
.card-head .icon-button{width:30px;height:30px;margin:-3px -5px 0 0}
.card-head .icon-button svg{width:18px;height:18px}
.metadata{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:11px}
.meta-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:6px;background:var(--panel-2)}
.meta-chip svg{width:12px;height:12px}
.meta-chip.warning{background:var(--amber-bg);color:var(--amber)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:17px;min-height:42px}
.status{display:inline-flex;align-items:center;gap:5px;color:var(--faint);font-size:11px;min-width:0}
.status svg{width:14px;height:14px}
.status.ready,.status.bundled{color:var(--green)}
.status.pending{color:var(--amber)}
.status.error{color:var(--red)}
.status .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.current-tag{margin-left:5px;padding:2px 6px;background:var(--green-bg);border-radius:5px;font-size:10px}
.resource-card .card-foot .btn{min-height:36px;padding:7px 14px;font-size:12px}
.note{margin-top:13px;border-radius:10px;padding:10px 12px;background:var(--panel-2);font-size:12px;color:var(--muted);line-height:1.65}
.note svg{width:15px;height:15px;margin-right:5px;vertical-align:-3px;color:var(--primary)}
.note.blue{background:var(--tonal);color:var(--tonal-text)}
.note.warning{background:var(--amber-bg);color:var(--amber)}
.transfer{margin-top:12px}
.progress-track{height:4px;background:var(--panel-2);border-radius:8px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:8px;transition:width .2s linear}
.transfer-label{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;margin:8px 0}
.transfer-label button{background:transparent;padding:0 2px;color:var(--primary)}
.group-summary{display:flex;align-items:center;gap:9px;margin-bottom:13px;color:var(--muted);font-size:12px}
.templates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.template{padding:14px 10px 9px;background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0;position:relative;display:flex;flex-direction:column;align-items:flex-start}
.template-mark{height:33px;min-width:33px;border-radius:10px;display:grid;place-items:center;padding:0 7px;font-size:13px;font-weight:700;background:var(--panel-2);color:var(--primary);letter-spacing:-.03em;margin-bottom:9px}
.template:nth-child(3n+2) .template-mark{color:var(--green)}
.template:nth-child(3n) .template-mark{color:var(--amber)}
.template h3{font-size:12px;font-weight:600;overflow-wrap:anywhere}
.template p{font-size:10px;color:var(--faint);margin:3px 0 5px}
.template button{background:transparent;color:var(--primary);display:flex;align-items:center;justify-content:space-between;width:100%;font-size:11px;min-height:32px;padding:4px 0 0}
.template button svg{width:14px;height:14px}
.template .template-state{position:absolute;right:10px;top:12px;color:var(--green)}
.template .template-state svg{width:14px;height:14px}
.template .progress-track{width:100%;margin-top:6px}
.page-foot{display:flex;align-items:flex-start;justify-content:center;gap:7px;color:var(--faint);text-align:left;font-size:11px;max-width:520px;margin:28px auto 0;padding:0 8px}
.page-foot svg{width:14px;height:14px;margin-top:2px}
.empty{grid-column:1/-1;padding:44px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.empty svg{width:30px;height:30px;margin-bottom:10px;color:var(--faint)}
.empty h3{font-size:15px;color:var(--text);margin-bottom:6px}
.empty p{font-size:12px}
.ready-filter{display:flex;justify-content:space-between;align-items:center;background:var(--green-bg);color:var(--green);padding:8px 12px;font-size:12px;border-radius:10px;margin-bottom:15px}
.ready-filter button{color:inherit;background:transparent;min-height:30px}
.bottom-sign{height:4px;width:110px;background:var(--faint);opacity:.3;margin:40px auto 0;border-radius:4px}
dialog{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:26px;width:min(620px,calc(100% - 32px));max-height:88dvh;padding:0;box-shadow:var(--shadow);overflow:hidden}
dialog::backdrop{background:#0008;backdrop-filter:blur(3px)}
.sheet-layout{display:flex;flex-direction:column;max-height:88dvh}
.sheet-handle{display:none}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:24px 22px 14px;flex:none}
.sheet-head .title{min-width:0;flex:1}
.sheet-head h2{font-size:20px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.sheet-head p{font-size:12px;color:var(--muted);margin-top:6px}
.sheet-head .icon-button{margin:-7px -8px 0 0}
.sheet-content{overflow-y:auto;overscroll-behavior:contain;padding:4px 22px 24px;min-height:0}
.sheet-actions{padding:14px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--panel);flex:none}
.sheet-actions:empty{display:none}
.import-tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel-2);padding:4px;border-radius:12px;gap:3px;margin-bottom:18px}
.import-tab{min-height:40px;padding:6px;background:transparent;color:var(--muted);font-size:12px;border-radius:9px}
.import-tab.active{background:var(--panel);color:var(--primary);font-weight:600}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select{width:100%;min-width:0;min-height:46px;padding:10px 12px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:11px;outline-offset:2px;font-size:13px}
.field input::placeholder{color:var(--faint)}
.field small{font-size:11px;color:var(--faint)}
.field input[type=file]{font-size:12px;padding:8px}
.field input::file-selector-button{background:var(--tonal);border:0;border-radius:7px;color:var(--tonal-text);padding:7px 9px;margin-right:10px}
.field-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hub-result{padding:14px 0;border-bottom:1px solid var(--line)}
.hub-result:last-child{border-bottom:0}
.hub-result h3{font-size:13px;font-weight:600}
.hub-result p{font-size:11px;color:var(--faint);margin-top:5px;overflow-wrap:anywhere}
.hub-result .result-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
.hub-result .btn{min-height:34px;font-size:11px;padding:6px 12px}
.hub-search{margin-bottom:6px}
.inline-tip{font-size:11px;color:var(--faint);margin:8px 0 14px}
.field-error{margin:0 0 14px;color:var(--red);font-size:12px}
.example-link{background:transparent;color:var(--primary);padding:4px 0;font-size:12px;min-height:32px}
.review-card{margin:18px 0 0;padding:15px;background:var(--panel-2);border-radius:13px}
.review-card h3{font-size:14px;margin-bottom:6px}
.review-card p{font-size:12px;color:var(--muted);margin-top:5px}
.review-card .btn{margin-top:15px}
.details-list{margin:6px 0 18px}
.details-row{padding:11px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;font-size:12px}
.details-row dt{color:var(--faint)}
.details-row dd{margin:0;overflow-wrap:anywhere}
.details-list a{display:inline-flex;align-items:center;gap:5px}
.details-list a svg{width:13px;height:13px}
.file-list{margin:0;padding:0;list-style:none}
.file-list li{font-size:11px;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.details-label{font-size:12px;font-weight:600;margin:20px 0 8px}
.choice{padding:15px 12px;width:100%;display:flex;gap:12px;align-items:center;background:transparent;border:1px solid var(--line);border-radius:13px;text-align:left;margin:9px 0}
.choice.selected{background:var(--tonal);border-color:var(--primary)}
.choice>svg{color:var(--primary)}
.choice-copy{flex:1;min-width:0}
.choice-copy strong{display:block;font-size:13px;font-weight:550}
.choice-copy small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.switch-row{padding:15px 0;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line)}
.switch-row .copy{flex:1;min-width:0}
.switch-row strong{font-size:13px;font-weight:500}
.switch-row p{font-size:11px;color:var(--muted);margin-top:4px}
.switch-row input{appearance:none;width:40px;height:24px;padding:3px;border-radius:14px;background:var(--line);cursor:pointer;flex:none;margin:0}
.switch-row input:before{content:"";display:block;width:18px;height:18px;background:var(--faint);border-radius:50%;transition:transform .15s}
.switch-row input:checked{background:var(--primary)}
.switch-row input:checked:before{background:var(--on-primary);transform:translateX(16px)}
.scenario-buttons{display:flex;gap:10px;margin:16px 0}
.scenario-buttons .btn{flex:1;font-size:12px}
.toast{position:fixed;bottom:calc(25px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,16px);width:max-content;max-width:calc(100% - 32px);padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:var(--text);color:var(--bg);box-shadow:var(--shadow);font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100}
.toast.visible{opacity:1;transform:translate(-50%,0)}
.dialog-toast{background:var(--tonal);color:var(--tonal-text);border-radius:10px;font-size:12px;padding:10px 12px;margin-top:14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:760px){.hero{padding:27px 28px}
.hero-copy p{max-width:none}
.hero h2{font-size:26px}
.tabs{max-width:470px}
.templates{grid-template-columns:repeat(5,minmax(0,1fr))}
.resource-card.wide{grid-column:1/-1}
.resource-card.wide .card-foot{margin-top:13px}
.resource-card.wide .note{max-width:700px}
.card-heading h3{font-size:15px}
.resource-card{padding:20px}
.template{padding:17px 15px 10px}
.template h3{font-size:13px}
.template p{font-size:11px}
}
@media(max-width:599px){.app{padding:0 18px 30px}
.preview-bar{padding:12px 18px 0}
.preview-hint{display:none}
.appbar{min-height:68px;gap:9px}
.appbar h1{font-size:19px}
.hero{padding:19px 17px;border-radius:21px}
.hero-top{gap:12px}
.hero-icon{width:43px;height:43px;border-radius:14px}
.hero-icon svg{width:23px;height:23px}
.hero h2{font-size:21px}
.hero-copy p{font-size:12px;line-height:1.7}
.hero .eyebrow{font-size:10px}
.hero .icon-button{width:32px;height:32px;margin:-3px -5px 0 0}
.hero-bottom{margin-top:16px;padding-top:12px;gap:5px}
.platform{font-size:10px}
.platform svg{width:13px;height:13px}
.prepared-link{font-size:10px;gap:3px}
.prepared-link svg{width:12px;height:12px}
.tabs{margin:20px 0 18px}
.tab{height:44px;font-size:13px}
.tab svg{width:17px;height:17px}
.cards{grid-template-columns:minmax(0,1fr);gap:11px}
.resource-card{padding:16px;border-radius:18px}
.toolbar .btn{padding:10px 14px;font-size:12px}
.toolbar .btn svg{width:16px;height:16px}
.source-row{font-size:11px}
.source-picker{font-size:11px}
.card-heading h3{font-size:14px}
.section{margin-top:23px}
.section-head h2{font-size:13px}
.filters{gap:7px}
.filter{font-size:11px;padding:6px 11px}
.page-foot{font-size:10px}
.template p{font-size:10px}
.template h3{font-size:12px}
dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:25px 25px 0 0;border-bottom:0;max-height:92dvh}
.sheet-layout{max-height:92dvh}
.sheet-handle{display:block;width:34px;height:4px;border-radius:8px;background:var(--line);margin:10px auto 0;flex:none}
.sheet-head{padding:15px 20px 13px}
.sheet-head h2{font-size:19px}
.sheet-content{padding:4px 20px 22px}
.sheet-actions{padding-left:20px;padding-right:20px}
.sheet-actions .btn{flex:1}
.import-tabs{margin-bottom:16px}
.field-pair{gap:10px}
.details-row{grid-template-columns:72px minmax(0,1fr);font-size:12px}
}

function parseRepository(input){
 const raw=input.trim().replace(/\/+$/,'');if(!raw)throw new Error('请先填写模型仓库。');
 let source=state.source,parts;
 if(/^https?:\/\//i.test(raw)){
  const url=new URL(raw),allowed={'huggingface.co':'hf','hf-mirror.com':'mirror','modelscope.cn':'ms','www.modelscope.cn':'ms'};
  if(!Object.hasOwn(allowed,url.hostname))throw new Error('请使用 Hugging Face、ModelScope 或 HF-Mirror 的仓库地址。');
  source=allowed[url.hostname];parts=url.pathname.split('/').filter(Boolean);
  if(source==='ms'){if(parts[0]!=='models')throw new Error('ModelScope 地址应包含 /models/owner/repo。');parts.shift();}
 }else parts=raw.split('/');
 if(parts.length<2||!parts.slice(0,2).every(part=>/^[A-Za-z0-9_.-]+$/.test(part)&&part!=='.'&&part!=='..'))throw new Error('仓库格式应为 owner/repo，例如 csukuangfj/vits-zh-aishell3。');
 if(!/^https?:\/\//i.test(raw)&&parts.length!==2)throw new Error('请填写 owner/repo 或完整仓库网址。');
 const repo=parts.slice(0,2).join('/');
 const urlRevision=parts.length>=4&&['tree','resolve'].includes(parts[2])?decodeURIComponent(parts[3]):'';
 return {source,repo,revision:state.importDraft.revision.trim()||urlRevision||(source==='ms'?'master':'main')};
}

// 下载计时器仅用于演示进度和状态，不发起任何网络请求。
function startDownload(id,quiet=false){
 const item=itemById(id);if(isReady(item)){if(!quiet)toast('这项资源已经可用，无需重复下载。');return;}
 if(state.transfers.has(id))return;
 const result=state.downloadResult;state.downloadResult='success';
 const transfer={progress:0,timer:null,verify:null};state.transfers.set(id,transfer);
 const finish=success=>{
  if(state.transfers.get(id)!==transfer)return;
  clearInterval(transfer.timer);clearTimeout(transfer.verify);state.transfers.delete(id);state.itemStates.set(id,success?'ready':'error');render();
  if(!quiet)toast(success?'演示完成：资源已就绪。':result==='checksum'?'演示：文件校验失败，资源未标记为可用。':'演示：下载已中断，可重新下载。');
 };
 transfer.timer=setInterval(()=>{
  transfer.progress+=20;
  if(result==='network'&&transfer.progress===60){finish(false);return;}
  renderGroups();
  if(transfer.progress===100){clearInterval(transfer.timer);transfer.verify=setTimeout(()=>finish(result!=='checksum'),450);}
 },260);
 renderGroups();if(!quiet)toast('正在演示下载流程，不会实际联网。');
}
function cancelDownload(id,quiet=false){const transfer=state.transfers.get(id);if(!transfer)return;clearInterval(transfer.timer);clearTimeout(transfer.verify);state.transfers.delete(id);renderGroups();if(!quiet)toast('已取消本次下载演示。');}

document.addEventListener('click',event=>{
 const target=event.target.closest('[data-action]');if(!target)return;
 const action=target.dataset.action,id=target.dataset.id,value=target.dataset.value;
 switch(action){
  case 'back':toast('当前为离线资源页面的独立设计预览。');break;
  case 'close':closeSheet();break;
  case 'theme':setTheme();break;
  case 'preview':openPreview();break;
  case 'refresh':render();toast('已刷新演示目录；当前状态并非手机实际资源。');break;
  case 'tab':state.tab=value;state.query='';render();break;
  case 'filter':if(state.tab==='models')state.filterModels=value;else state.filterResources=value;render();break;
  case 'ready-filter':state.readyOnly=!state.readyOnly;render();break;
  case 'details':openDetails(id);break;
  case 'source':openSources('main');break;
  case 'import-source':openSources('import');break;
  case 'choose-source':state.source=value;render();if(state.sourceReturn==='import')openImport(state.importTab);else closeSheet();break;
  case 'source-done':if(state.sourceReturn==='import')openImport(state.importTab);else closeSheet();break;
  case 'import-model':openImport();break;
  case 'import-tab':openImport(value);break;
  case 'import-item':{const item=itemById(id);if(['stt','tts','ocr'].includes(item.kind)){state.importDraft.fileKind=item.kind;openImport('local');}else openResourceImport(id);break;}
  case 'import-resource':openResourceImport(id);break;
  case 'repo-example':state.importDraft.repository=state.source==='ms'?'csukuangfj/vits-zh-aishell3':'https://huggingface.co/csukuangfj/vits-zh-aishell3';$('repoInput').value=state.importDraft.repository;break;
  case 'review-known':state.source=state.review.source;render();openDetails(id);break;
  case 'add-repository':{const review=state.review;if(!review)return;const host=review.source==='ms'?`https://modelscope.cn/models/${review.repo}`:`https://${sources[review.source].host}/${review.repo}`;addImportedModel({kind:state.importDraft.kind,title:review.repo.split('/')[1],bytes:null,version:review.revision,repo:review.repo,source:'custom',files:[],customSource:review.source,homepage:host});break;}
  case 'download':if(sheet.open)closeSheet();startDownload(id);break;
  case 'cancel-download':if(sheet.open)closeSheet();cancelDownload(id);break;
  case 'download-templates':{const missing=templates.filter(item=>!isReady(item)&&!state.transfers.has(item.id));missing.forEach(item=>startDownload(item.id,true));toast(missing.length?`演示准备 ${missing.length} 种模板，不会实际下载。`:'全部模板已经准备好。');break;}
  case 'use-model':{const item=itemById(id);if(!isReady(item)){toast('请先完成资源校验。');break;}state.current[item.kind]=id;closeSheet();render();toast('演示：已设为当前使用的模型。');break;}
  case 'export':toast('预览：此处将打开保存位置，导出对应资源的 ZIP 备份。');break;
  case 'confirm-remove':confirmRemove(id);break;
  case 'remove':{const item=itemById(id);if(statusOf(item)==='bundled')break;if(state.current[item.kind]===id)state.current[item.kind]=null;if(item.imported){models.splice(models.indexOf(item),1);state.itemStates.delete(id);}else state.itemStates.set(id,'missing');closeSheet();render();toast('已移除演示记录，没有删除手机文件。');break;}
  case 'scenario-old':applyScenario(true);break;
  case 'scenario-lean':applyScenario(false);break;
  case 'reset-preview':applyScenario(true,true);break;
 }
});
document.addEventListener('input',event=>{
 const target=event.target;
 if(target.id==='resourceSearch'){state.query=target.value;renderGroups();}
 if(target.id==='hubSearch'){state.hubQuery=target.value;renderHubResults();}
 const drafts={repoInput:'repository',repoRevision:'revision',repoKind:'kind',modelName:'name',localModelKind:'fileKind'};
 if(Object.hasOwn(drafts,target.id))state.importDraft[drafts[target.id]]=target.value;
 if(['repoInput','repoRevision','repoKind'].includes(target.id)&&$('repoReview')){$('repoReview').innerHTML='';state.review=null;}
});
document.addEventListener('change',event=>{
 const target=event.target;
 if(target.id==='modelFile'){state.selectedModelFile=target.files.length?target.files[0]:null;$('selectedModelFile').textContent=state.selectedModelFile?state.selectedModelFile.name:'ZIP / tar.gz / tar.bz2 模型包';}
 if(target.id==='scenarioPlugin'){state.bundledPlugin=target.checked;if(target.checked)cancelDownload('apktool',true);render();}
 if(target.id==='scenarioOcr'){state.bundledOcr=target.checked;if(target.checked)cancelDownload('ocr',true);if(!isReady(itemById('ocr')))state.current.ocr=null;render();}
 if(target.id==='scenarioTerminal'){state.terminalInstalled=target.checked;render();}
 if(target.id==='downloadResult')state.downloadResult=target.value;
});
document.addEventListener('submit',event=>{
 event.preventDefault();
 if(event.target.id==='repositoryForm')reviewRepository();
 if(event.target.id==='localModelForm'){
  const file=state.selectedModelFile;
  if(!file){$('localError').hidden=false;$('localError').textContent='请先选择模型包。';return;}
  addImportedModel({kind:state.importDraft.fileKind,title:state.importDraft.name.trim()||file.name,bytes:file.size,version:'用户导入',repo:file.name,source:'local',files:[file.name]});
 }
 if(event.target.id==='resourceImportForm'){
  const file=$('resourceZip').files[0],id=$('resourceTarget').value;
  if(!file){$('resourceImportError').hidden=false;$('resourceImportError').textContent='请先选择对应的 ZIP 备份。';return;}
  const item=itemById(id);if(statusOf(item)==='bundled'){toast('包内资源已可用，无需重复导入。');return;}
  if(state.transfers.has(id))cancelDownload(id,true);
  state.itemStates.set(id,'pending');state.tab='resources';state.query='';state.readyOnly=false;state.filterResources=item.kind;closeSheet();render();toast('已添加资源导入演示，校验完成前不会标为可用。');
 }
});
sheet.addEventListener('click',event=>{if(event.target===sheet){const bounds=sheet.getBoundingClientRect();if(event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom)closeSheet();}});
document.querySelector('.tabs').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();state.tab=event.key==='Home'?'models':event.key==='End'?'resources':state.tab==='models'?'resources':'models';state.query='';render();$(`tab-${state.tab}`).focus();});
document.querySelectorAll('[data-icon]').forEach(element=>element.innerHTML=icon(element.dataset.icon));
const params=new URLSearchParams(location.search);
if(params.get('theme')==='light')setTheme();
if(params.get('tab')==='resources')state.tab='resources';
if(params.get('apk')==='lean'){state.bundledPlugin=false;state.bundledOcr=false;state.terminalInstalled=false;state.current={stt:null,tts:null,ocr:null};state.itemStates.set('ncnn','missing');}
render();
if(params.get('dialog')==='import')openImport();

</script>
</body>
</html>

name: OperitX Build

on:
  push:
    branches: [feature/nonox-integration, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-new-modules:
    name: Build & Test New Modules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build new modules
        run: |
          ./gradlew :provider:compileDebugKotlin :orchestration:compileDebugKotlin :memory:compileDebugKotlin --no-daemon

      - name: Run unit tests
        run: |
          ./gradlew :provider:testDebugUnitTest :orchestration:testDebugUnitTest :memory:testDebugUnitTest --no-daemon

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            provider/build/reports/tests/
            orchestration/build/reports/tests/
            memory/build/reports/tests/
          retention-days: 14

  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-new-modules

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install CMake
        run: sdkmanager "cmake;3.22.1"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Enable skipNativeBuild in gradle.properties
        run: |
          echo "skipNativeBuild=true" >> gradle.properties

      - name: Create stub .so files for native modules
        run: |
          # Create stub shared libraries so APK packaging succeeds
          # These are empty .so files — native features won't work but the APK will install
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p llm/llama/build/intermediates/merged_native_libs/debug/out/lib/arm64-v8a
          mkdir -p llm/mnn/build/intermediates/merged_native_libs/debug/out/lib/arm64-v8a
          mkdir -p quickjs/build/intermediates/merged_native_libs/debug/out/lib/arm64-v8a
          mkdir -p avator/dragonbones/build/intermediates/merged_native_libs/debug/out/lib/arm64-v8a
          mkdir -p avator/mmd/build/intermediates/merged_native_libs/debug/out/lib/arm64-v8a
          mkdir -p avator/fbx/build/intermediates/merged_native_libs/debug/out/lib/arm64-v8a
          mkdir -p terminal/build/intermediates/merged_native_libs/debug/out/lib/arm64-v8a

          # Create minimal valid .so files (ELF header only)
          # This is a minimal ELF shared object for aarch64
          python3 -c "
          import struct
          # Minimal ELF64 header for aarch64 shared object
          elf = bytearray()
          # ELF magic + class + data + version
          elf += b'\x7fELF'  # magic
          elf += bytes([2, 1, 1, 0])  # 64-bit, little-endian, version 1
          elf += bytes(8)  # padding
          elf += struct.pack('<H', 3)  # ET_DYN (shared object)
          elf += struct.pack('<H', 183)  # EM_AARCH64
          elf += struct.pack('<I', 1)  # EV_CURRENT
          elf += struct.pack('<Q', 0)  # entry
          elf += struct.pack('<Q', 64)  # phoff
          elf += struct.pack('<Q', 0)  # shoff
          elf += struct.pack('<I', 0)  # flags
          elf += struct.pack('<H', 64)  # ehsize
          elf += struct.pack('<H', 56)  # phentsize
          elf += struct.pack('<H', 1)  # phnum
          elf += struct.pack('<H', 64)  # shentsize
          elf += struct.pack('<H', 0)  # shnum
          elf += struct.pack('<H', 0)  # shstrndx
          # Program header (PT_LOAD)
          elf += struct.pack('<I', 1)  # p_type = PT_LOAD
          elf += struct.pack('<I', 5)  # p_flags = PF_R | PF_X
          elf += struct.pack('<Q', 0)  # p_offset
          elf += struct.pack('<Q', 0)  # p_vaddr
          elf += struct.pack('<Q', 0)  # p_paddr
          elf += struct.pack('<Q', 120)  # p_filesz
          elf += struct.pack('<Q', 120)  # p_memsz
          elf += struct.pack('<Q', 0x1000)  # p_align

          for name in [
              'libsherpa-ncnn-jni.so',
              'libsherpa-mnn-jni.so',
              'libllama.so',
              'libmnn.so',
              'libtoolpkgwasm.so',
              'libstreamnative.so',
              'libdragonbones.so',
              'libmmd.so',
              'libfbx.so',
              'libquickjs.so',
              'liboperit_ripgrep.so',
          ]:
              path = f'app/src/main/jniLibs/arm64-v8a/{name}'
              with open(path, 'wb') as f:
                  f.write(elf)
              print(f'Created stub: {path}')
          "

      - name: Create stub ffmpeg-kit AAR
        run: |
          mkdir -p /tmp/ffmpegkit-aar/jni/arm64-v8a /tmp/ffmpegkit-aar/classes
          echo "Manifest-Version: 1.0" > /tmp/ffmpegkit-aar/classes/MANIFEST.MF
          cat > /tmp/ffmpegkit-aar/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.arthenica.ffmpegkit">
          </manifest>
          MANIFEST
          cd /tmp/ffmpegkit-aar
          for lib in libffmpegkit.so libffmpegkit_abidetect.so libavcodec.so libavdevice.so libavfilter.so libavformat.so libavutil.so libc++_shared.so libswresample.so libswscale.so; do
            cp $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so jni/arm64-v8a/$lib
          done
          zip -r $GITHUB_WORKSPACE/app/libs/ffmpeg-kit-local.aar AndroidManifest.xml classes/ jni/

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon -PskipNativeBuild=true --stacktrace 2>&1 | tee /tmp/gradle-output.log | tail -200

      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== LAST 300 LINES OF BUILD LOG ==="
          tail -300 /tmp/gradle-output.log 2>/dev/null || echo "No log"
          echo "=== GREP FOR ERRORS ==="
          grep -i 'error\|FAILED\|failure\|exception' /tmp/gradle-output.log 2>/dev/null | tail -30 || echo "No errors found"

      - name: Check build outputs
        if: always()
        run: |
          echo "=== APK outputs ==="
          find app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo "=== Build intermediates ==="
          ls -la app/build/intermediates/kotlin_classes/debug/ 2>/dev/null || echo "No kotlin classes"
          echo "=== APK dir ==="
          ls -laR app/build/outputs/apk/ 2>/dev/null || echo "No APK directory"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonox-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: /tmp/gradle-output.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonox-build-output
          path: |
            app/build/intermediates/kotlin_classes/debug/
            app/build/intermediates/javac/debug/
          retention-days: 7
          if-no-files-found: warn

name: OperitX Build

on:
  push:
    branches: [feature/nonox-integration, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  ANDROID_NDK_VERSION: '25.1.8937393'
  ANDROID_CMAKE_VERSION: '3.22.1'
  ANDROID_API_LEVEL: '26'
  RUST_VERSION: '1.88.0'
  MANUAL_DEPS_DIR: manual-deps

jobs:
  build-new-modules:
    name: Build & Test New Modules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build new modules
        run: |
          ./gradlew :provider:compileDebugKotlin :orchestration:compileDebugKotlin :memory:compileDebugKotlin --no-daemon

      - name: Run unit tests
        run: |
          ./gradlew :provider:testDebugUnitTest :orchestration:testDebugUnitTest :memory:testDebugUnitTest --no-daemon

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            provider/build/reports/tests/
            orchestration/build/reports/tests/
            memory/build/reports/tests/
          retention-days: 14

  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: build-new-modules

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize terminal submodule
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- terminal
          git submodule update --init --recursive --depth 1 terminal

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"

      - name: Restore Android dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MANUAL_DEPS_DIR }}
          key: android-full-deps-${{ runner.os }}-${{ hashFiles('ci/script/download_android_dependencies.sh', 'ci/script/prepare_android_dependencies.py') }}

      - name: Download Android dependencies
        if: steps.cache-manual-deps.outputs.cache-hit != 'true'
        run: bash ci/script/download_android_dependencies.sh full "$MANUAL_DEPS_DIR"

      - name: Prepare Android dependencies
        run: |
          python3 ci/script/prepare_android_dependencies.py \
            --profile full \
            --archives "$MANUAL_DEPS_DIR" \
            --repository "$GITHUB_WORKSPACE"

      - name: Restore native ripgrep cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/native_ripgrep/target
          key: native-ripgrep-arm64-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API_LEVEL }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('tools/native_ripgrep/Cargo.toml', 'tools/native_ripgrep/Cargo.lock', 'tools/native_ripgrep/**/*.rs') }}

      - name: Build native ripgrep
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" aarch64-linux-android
          cargo "+$RUST_VERSION" build \
            --manifest-path tools/native_ripgrep/Cargo.toml \
            --release \
            --target aarch64-linux-android \
            --locked
          install -Dm755 \
            tools/native_ripgrep/target/aarch64-linux-android/release/liboperit_ripgrep.so \
            app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so
          test -s app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@10.34.5
          npm ci --no-audit --no-fund
          npm --prefix web-chat ci --no-audit --no-fund

      - name: Build WebChat assets
        run: |
          npm run build:webchat

      - name: Build bundled ToolPkg packages
        run: |
          npm run build:examples:github
          python3 tools/example_packages/sync_example_packages.py --no-hot-reload

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Run Gradle build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: operitx-debug-apk
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operitx-reports
          path: |
            app/build/reports/**/*
            build/reports/**/*
          if-no-files-found: warn
          retention-days: 14
